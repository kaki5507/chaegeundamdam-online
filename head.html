<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/jua.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<title>채근담담 온라인 : 야채 무기 대모험</title>
<style>
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;margin:0;height:100%;background:radial-gradient(ellipse at 50% 20%,#3a2a7a,#140a30);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#2a1f6a;box-shadow:0 0 60px rgba(255,170,230,.35);image-rendering:auto}
#auth{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(60,110,70,.45),rgba(6,20,14,.86));display:flex;align-items:center;justify-content:center;z-index:50;font-family:"Jua","Malgun Gothic",sans-serif;-webkit-user-select:text;user-select:text}
#auth .box{position:relative;width:min(380px,90vw);background:linear-gradient(180deg,#f8eccb,#ead6a4);border-radius:10px;padding:26px 26px 22px;color:#3e2c14;box-shadow:0 12px 50px rgba(0,0,0,.55),inset 0 0 0 2px #fff6dc,inset 0 0 40px rgba(150,110,40,.25);border:3px solid #8a6a32}
#auth .box:before{content:"❦  모험가 등록  ❦";position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#2f5a3a,#1e3e28);color:#f4dc98;padding:5px 18px;border-radius:6px;font-size:14px;white-space:nowrap;border:2px solid #c8a050;box-shadow:0 3px 10px rgba(0,0,0,.4)}
#auth h2{margin:4px 0 4px;color:#2e4a24;font-weight:normal;font-size:28px;text-align:center;text-shadow:0 1px 0 #fff6dc}#auth .sub{margin:0 0 14px;color:#6a5430;font-size:14px;text-align:center}
#auth input{display:block;width:100%;box-sizing:border-box;margin:9px 0;padding:12px 16px;border-radius:6px;border:2px solid #b8975a;background:#fffaf0;color:#3e2c14;font-size:16px;font-family:inherit;outline:none;transition:.15s}
#auth input:focus{border-color:#4a8a3a;box-shadow:0 0 0 4px rgba(90,150,70,.25)}
#auth .msg{min-height:20px;font-size:14px;color:#a8361e;margin:4px 0 10px;text-align:center}
#auth .row{display:flex;gap:8px}#auth button{flex:1;padding:12px 6px;border-radius:6px;border:2px solid #c8a050;background:linear-gradient(180deg,#4a8a4a,#2a5a32);color:#fff4d0;font-size:16px;font-family:inherit;cursor:pointer;box-shadow:0 4px 0 #173a1e;transition:.1s}
#auth button:active{transform:translateY(3px);box-shadow:0 1px 0 #173a1e}
#auth button.g{background:linear-gradient(180deg,#e8d6a8,#c8ae74);color:#4a3418;border-color:#8a6a32;box-shadow:0 4px 0 #8a6a32}
#chatbar select,#chatbar input,#chatbar button{font-family:"Jua","Malgun Gothic",sans-serif;font-size:15px;border-radius:16px;border:2px solid #f0c8ff;padding:7px 12px;outline:none}
#chatbar select{background:#fff0fa;color:#8a4ac0}#chatbar input{flex:1;background:rgba(255,255,255,.95);color:#5a3a8a}#chatbar input:focus{border-color:#ff9ad8}
#chatbar button{background:linear-gradient(180deg,#ffb8e4,#ff8ad0);color:#fff;border-color:#ff9ad8;cursor:pointer}
#chatbar button.x{background:#fff;color:#a07ac0;border-color:#e2d0ff;padding:0 10px}#chatbar>*{height:100%;box-sizing:border-box}
#chatbar.sm select,#chatbar.sm input,#chatbar.sm button{font-size:16px;padding:2px 8px;border-radius:12px;border-width:1.5px}#chatbar.sm select{max-width:96px}#chatbar.sm input{min-width:0}
#touch{display:none;position:fixed;inset:0;pointer-events:none;font-family:sans-serif}
#touch .b{position:absolute;pointer-events:auto;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);color:#fff;font:bold 15px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none}
#touch .b.on{background:rgba(255,220,120,.5)}
@media (pointer:coarse) and (orientation:portrait){body{display:block!important}canvas#c{margin:70px auto 0!important;position:relative!important;top:0!important;transform:none!important}}
</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
 <div class="b" data-k="ArrowLeft" style="left:14px;bottom:70px">◀</div>
 <div class="b" data-k="ArrowRight" style="left:90px;bottom:70px">▶</div>
 <div class="b" data-k="ArrowUp" style="left:52px;bottom:134px">▲</div>
 <div class="b" data-k="ArrowDown" style="left:52px;bottom:6px">▼</div>
 <div class="b" data-k="Space" style="right:14px;bottom:70px">점프</div>
 <div class="b" data-k="KeyZ" style="right:82px;bottom:30px">공격</div>
 <div class="b" data-k="KeyX" style="right:150px;bottom:70px;width:48px;height:48px">X</div>
 <div class="b" data-k="KeyC" style="right:96px;bottom:112px;width:48px;height:48px">C</div>
 <div class="b" data-k="KeyV" style="right:40px;bottom:146px;width:48px;height:48px">V</div>
 <div class="b" data-k="KeyB" style="right:150px;bottom:126px;width:44px;height:44px">B</div>
 <div class="b" data-k="KeyN" style="right:150px;bottom:176px;width:44px;height:44px">N</div>
 <div class="b" data-k="Enter" style="left:170px;bottom:6px;width:46px;height:46px">OK</div>
 <div class="b" data-k="Escape" style="left:222px;bottom:6px;width:46px;height:46px">취소</div>
 <div class="b" data-k="KeyQ" style="right:14px;top:8px;width:42px;height:42px">Q</div>
 <div class="b" data-k="KeyI" style="right:62px;top:8px;width:42px;height:42px">I</div>
 <div class="b" data-k="KeyE" style="right:110px;top:8px;width:42px;height:42px">E</div>
</div>
<script>
