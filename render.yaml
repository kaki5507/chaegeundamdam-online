# Render Blueprint — Node 웹 서비스 (정적 게임 + 계정/저장 API). DB 는 Neon(무료 Postgres) 사용.
services:
  - type: web
    name: chaegeundamdam-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL      # Neon 연결 문자열 (Dashboard > Environment 에서 직접 입력)
        sync: false
      - key: SECRET            # 로그인 토큰 서명 키 (자동 생성)
        generateValue: true
      - key: ADMIN_NAMES       # 운영자 게임 이름 (쉼표로 여러 명, 비워두면 기본값 "운영자") — 상단 [🛠 운영] 버튼 · /운영
        sync: false
      - key: NODE_VERSION
        value: "20"
