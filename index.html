/* ---------- 맵 ---------- */
function genField(c){
  const C=CH[c],r=mulberry(500+c*37),Hh=1000,seq=['n','c','m','n','v','n','c','n','m','n'];
  const L=newL({id:'ch'+c+'f',name:C.place,sub:'제'+c+'화 「'+C.title+'」 · 점프맵',theme:C.theme,music:'sky',w:0,h:Hh,killY:Hh+90,mscale:C.ms,pit:true,ch:c,mhue:C.hue,dmul:C.dm});
  let y=720;L.plats.push(plat(-300,y,660,400,'s'));L.spawn={x:200,y};
  let cur={x:0,w:360,y},x=360;const N=24+c*2;
  for(let i=0;i<N;i++){
    const k=i<2?'n':seq[(i*3+c)%seq.length];let nx,w,ny;
    if(k==='m'){const gap=240;w=130;ny=cur.y-10;
      L.plats.push(plat(x+gap/2-50,cur.y-4,100,16,'o',{mv:{x0:x+gap/2-50,y0:cur.y-4,ax:gap/2-62,ay:0,sp:.95+c*.04,ph:r()*6}}));nx=x+gap;L.plats.push(plat(nx,ny,w,16,'o'))}
    else if(k==='v'){const up=cur.y>=560,dist=170;w=130;ny=up?cur.y-dist:cur.y+dist;const y0=up?cur.y-dist/2:cur.y+dist/2;
      L.plats.push(plat(x+40,y0,110,16,'o',{mv:{x0:x+40,y0,ax:0,ay:dist/2,sp:1.1,ph:up?Math.PI:0}}));nx=x+190;L.plats.push(plat(nx,ny,w,16,'o'))}
    else{const gap=36+r()*44;w=Math.round(110+r()*80);ny=clamp(cur.y+Math.round(-62+r()*110),340,820);nx=x+gap;
      const cr=k==='c'&&c>=2;L.plats.push(plat(nx,ny,w,16,'o',cr?{crumble:{timer:0,fall:false,fy:0,back:0}}:{}));
      if(!cr&&w>=150&&i%3===0)L.spikes.push({x:nx+w/2-22,y:ny,w:44});
      else if(!cr&&w>=140)L.mobs.push([C.types.includes('egg')?'egg':'wisp',nx+w/2,ny,nx+14,nx+w-14]);
      if(i%3===1)L.mobs.push(['wisp',nx+w/2,ny-110,80]);
      if(i%4===2&&c>=3)L.drops.push({x:nx+w/2,y:Math.max(60,ny-330),period:3+r(),ph:r()*3});}
    if(i===Math.floor(N/2))L.flags.push({x:nx+w/2,y:ny});
    cur={x:nx,w,y:ny};x=nx+w;
  }
  const ex=x+60;L.plats.push(plat(ex,cur.y,500,400,'s'));
  L.portals.push({x:ex+250,y:cur.y,to:'stele',label:'비석의 길로',reach:'ch'+c+'f'});
  L.w=ex+620;return L;
}
function genDg(c){
  const C=CH[c],r=mulberry(900+c*13);
  const L=arenaBase({id:'ch'+c+'d',name:C.dg,sub:'제'+c+'화 · 던전 — 세 웨이브를 버텨라!',theme:C.theme,music:'boss',mscale:C.ms,ch:c,mhue:C.hue,dmul:C.dm});
  const lay=[[120,350,220],[940,350,220],[520,250,240],[300,180,120],[860,180,120]];
  lay.slice(0,3+(c%3)).forEach(([x,y,w])=>L.plats.push(plat(x+Math.round((r()-.5)*40),y,w,14,'o')));
  L.dg={waves:[{n:8+c,max:6,every:1.1,types:C.types},{n:11+c*2,max:8,every:.9,types:C.types},{n:14+c*2,max:9,every:.8,types:C.types.concat(['baby'])}]};
  return L;
}
function genBossMap(c){
  const C=CH[c];
  const L=arenaBase({id:'ch'+c+'b',name:C.boss.name,sub:'제'+c+'화 「'+C.title+'」 · 결말',theme:C.theme,music:'boss',boss:'sb'+c,ch:c,dmul:C.dm,mscale:C.ms,mhue:C.hue});
  if(C.boss.base==='fox')L.plats.push(plat(110,360,300,14,'o'),plat(870,360,300,14,'o'),plat(500,250,280,14,'o'));
  else if(C.boss.base==='guimok')L.plats.push(plat(300,370,170,14,'o'),plat(810,370,170,14,'o'),plat(470,270,340,14,'o'),plat(130,285,150,14,'o'),plat(1000,285,150,14,'o'));
  else L.plats.push(plat(120,350,200,14,'o'),plat(960,350,200,14,'o'),plat(540,255,200,14,'o'));
  return L;
}
const chAvail=c=>c>=1&&c<=6&&SAVE.lvl>=CH[c].lv&&(c===1||steleOpen(c-1));
const steleOpen=c=>!!(SAVE.stele&&SAVE.stele[c]);
const cracks=c=>Math.min(2,(SAVE.dg&&SAVE.dg[c])||0)+(SAVE.cleared['sb'+c]?1:0);
function buildStele(){
  const gy=470,Wd=2560;
  const L=newL({id:'stele',name:'비석의 길',sub:'끝나지 못한 이야기들이 잠든 곳',theme:'origin',music:'field',w:Wd,h:540,town:true,hub:true,spawn:{x:170,y:gy}});
  L.plats.push(plat(-300,gy,Wd+600,300,'s'));
  L.portals=[{x:70,y:gy,to:'town',label:'야채마을'}];
  L.steles=[];for(let c=1;c<=6;c++)L.steles.push({c,x:560+(c-1)*330,y:gy});
  L.npcs=[{id:'dol',name:'돌할매',x:330,gy,look:'dol',tag:'비석지기'}];
  for(let c=1;c<=6;c++)if(chAvail(c))L.npcs.push({id:'c'+c,name:CH[c].hero.n,x:560+(c-1)*330+120,gy,look:'c'+c});

for(let c=1;c<=6;c++){const k=c;MAPS['ch'+c+'f']=()=>genField(k);MAPS['ch'+c+'d']=()=>genDg(k);MAPS['ch'+c+'b']=()=>genBossMap(k)}
MAPS.stele=buildStele;

/* ---------- 비석 ---------- */
function steleCheck(c){
  if(steleOpen(c)||cracks(c)<3)return;
  SAVE.stele[c]=true;saveGame();sfx('roar');S.shake=26;
  G.bigBanner={t0:G.t,title:'제'+c+'화의 비석이 뚫렸습니다!',sub:c<6?'제'+(c+1)+'화 「'+CH[c+1].title+'」 로 가는 길이 열렸다 (권장 Lv.'+CH[c+1].lv+')':'모든 비석이 열렸다… 돌할매를 찾아가자',col:'#ffe04a'};
}
function steleMenu(c){
  const C=CH[c],nm='제'+c+'화의 비석';
  if(!chAvail(c)){openDialog(nm,'굳게 봉인된 비석이다. 표면에 「'+C.title+'」 라고 희미하게 새겨져 있다.\n\n· 필요 레벨  Lv.'+C.lv+'  (현재 Lv.'+SAVE.lvl+')'+(c>1?'\n· 제'+(c-1)+'화의 비석이 뚫려야 한다'+(steleOpen(c-1)?' ✔':''):''),[{t:'닫기',fn:closeUI}]);return}
  const cr=cracks(c),fOK=SAVE.cleared['ch'+c+'f'],nd=(SAVE.dg[c]||0),opts=[];
  opts.push({t:'점프맵 · '+C.place+(fOK?' ✔':''),fn:()=>{closeUI();goMap('ch'+c+'f')}});
  opts.push({t:fOK?'던전 · '+C.dg+' ('+nd+'회)':'던전 · 🔒 점프맵 끝 도달 필요',fn:()=>{if(!fOK){G.toast('먼저 '+C.place+'까지 가야 한다');return}closeUI();goMap('ch'+c+'d')}});
  opts.push({t:nd>=1?'결말 · '+C.boss.name+(SAVE.cleared['sb'+c]?' ✔':''):'결말 · 🔒 던전 1회 클리어 필요',fn:()=>{if(nd<1){G.toast('던전을 먼저 클리어해야 한다');return}closeUI();goMap('ch'+c+'b')}});
  opts.push({t:'프롤로그 다시 보기',fn:()=>playScene('c'+c+'a',()=>steleMenu(c))});
  if(SAVE.cleared['sb'+c])opts.push({t:'결말 다시 보기',fn:()=>playScene('c'+c+'e',()=>steleMenu(c))});
  opts.push({t:'닫기',fn:closeUI});
  openDialog(nm,'제'+c+'화 「'+C.title+'」   권장 Lv.'+C.lv+'+\n\n비석 균열   '+'●'.repeat(cr)+'○'.repeat(3-cr)+(steleOpen(c)?'   — 뚫림!':'')+'\n· 던전 '+Math.min(nd,2)+'/2회   · 결말 보스 '+(SAVE.cleared['sb'+c]?'1':'0')+'/1\n\n이야기의 주인공 「'+C.hero.n+'」 이(가) 비석 옆에서 기다린다.',opts);
}
function dolMenu(n){
  const open=[1,2,3,4,5,6].filter(steleOpen).length;
  questMenu(n,'dol','비석 '+open+' / 6 개가 뚫렸구나.\n'+(open<6?'다음 이야기는 제'+(open+1)+'화 「'+CH[open+1].title+'」 (권장 Lv.'+CH[open+1].lv+').':'이제 남은 건 에필로그뿐이야.')+'\n\n· 비석 앞에서 ↑ : 점프맵 / 던전 / 결말 입장\n· 던전 2회 + 결말 보스 = 비석이 뚫린다');
  G.dlg.opts.splice(G.dlg.opts.length-1,0,{t:'비석의 길 이야기 다시 듣기',fn:()=>playScene('hub',()=>dolMenu(n))});

/* ---------- 던전 웨이브 ---------- */
function dgInit(){S.dg={w:0,killed:0,spawned:0,spT:1.2,pause:1.5,done:false};G.bigBanner={t0:G.t,title:'WAVE 1 / 3',sub:S.L.name,col:'#ffb060'}}
function storyStep(dt){
  const L=S.L;if(!L.dg||!S.dg||S.dg.done)return;
  const d=S.dg,w=L.dg.waves[d.w];
  if(d.pause>0){d.pause-=dt;return}
  d.spT-=dt;
  const alv=S.mobs.filter(m=>m.dgMob&&!m.dead).length;
  if(d.spawned<w.n&&alv<w.max&&d.spT<=0){
    d.spT=w.every;d.spawned++;const type=w.types[Math.random()*w.types.length|0],x=Math.random()<.5?60:L.w-60;
    const o={chase:true,dgMob:true,hue:L.mhue};
    if(type==='wisp')spawnMob('wisp',x,rnd(200,360),Object.assign(o,{range:30}));else spawnMob(type,x,440,o);
    spark(x,400,10,'#cfa8ff',160,.5,3,0,true);
  }
  // 낙오한 몹 보정 (맵 밖으로 사라진 경우)
  if(d.spawned>=w.n&&alv===0&&d.killed<w.n)d.killed=w.n;
  if(d.killed>=w.n){
    d.w++;d.killed=0;d.spawned=0;
    if(d.w>=L.dg.waves.length)dgClear();
    else{d.pause=1.8;G.bigBanner={t0:G.t,title:'WAVE '+(d.w+1)+' / 3',sub:d.w===2?'마지막 웨이브!':'',col:'#ffb060'};sfx('roar')}
  }
}
function dgClear(){
  const L=S.L,c=L.ch,C=CH[c];S.dg.done=true;
  for(const m of S.mobs)if(!m.dead){m.dead=true;spark(m.x,m.y-10,10,'#cfa8ff',200,.5,3,0,true)}
  SAVE.dg[c]=(SAVE.dg[c]||0)+1;
  const ex=Math.max(20,Math.round(need(SAVE.lvl)*.12*bossPct(SAVE.lvl))),cn=250*c;gainExp(ex);addCoins(cn);
  qev('dg',{ch:c});
  const lines=['경험치 +'+ex,'야채코인 +'+cn,'던전 클리어 '+SAVE.dg[c]+'회','비석 균열 '+cracks(c)+' / 3'];
  saveGame();

/* ---------- 능력치 (레벨당 AP 5) ---------- */
const STATS=[['str','힘','STR','#ff7a5a','공격력(전사·수호자·격투가) · 최대 HP'],['dex','민첩','DEX','#6ad06a','공격력(궁수·거너) · 크리티컬 소폭'],['int','지능','INT','#6ab0ff','공격력(마법사·성직자) · 최대 MP'],['luk','행운','LUK','#ffd34a','공격력(암살자) · 크리티컬']];
const PRIMARY={warrior:'str',guardian:'str',fighter:'str',archer:'dex',gunner:'dex',mage:'int',priest:'int',rogue:'luk'};
const SECOND={str:'dex',dex:'str',int:'luk',luk:'dex'};
function ensureAP(){
  if(!SAVE.ap){SAVE.ap={str:4,dex:4,int:4,luk:4};SAVE.apFree=5*(SAVE.lvl-1);autoAP()}
  if(SAVE.apFree==null)SAVE.apFree=0;
}
function autoAP(){ // 주 능력치 4 : 보조 능력치 1
  const pr=PRIMARY[SAVE.job],se=SECOND[pr],a=SAVE.ap;
  while(SAVE.apFree>0){if((a[se]-4)*4<(a[pr]-4))a[se]++;else a[pr]++;SAVE.apFree--}
}
// 레벨 기준 기대치 대비 투자량 → 공격 배율 (주스탯 몰빵 ≈1.0~1.1, 엉뚱한 스탯 ≈0.55)
function statMul(){
  const pr=PRIMARY[SAVE.job],se=SECOND[pr],a=SAVE.ap,L=SAVE.lvl;
  const eff=a[pr]+.25*a[se],ref=(4+4*(L-1))+.25*(4+(L-1));
  return clamp(.5+.5*eff/ref,.5,1.12);
}
function applyAP(p){
  const a=SAVE.ap;p.atkBase*=statMul();p.maxhp+=a.str*2;p.maxmp+=a.int*2;
  p.crit=clamp(.08+a.luk*.0012+a.dex*.0004,0,.45);
}

    else{closeUI();return}
    const p=PARTY[0],r=p.hp/p.maxhp;recalc(p);p.hp=Math.round(p.maxhp*r);saveGame();
  }
}

/* ---------- 장비 착용 규칙 ---------- */
function gearCheck(id){ // → 못 끼는 이유 배열
  const d=GEAR[id],why=[];
  if(d.wt&&d.wt!=='any'){const ok=(d.slot==='lh'?JOB_LH:JOB_WEAP)[SAVE.job]||[];if(!ok.includes(d.wt))why.push(JOB[SAVE.job].role+' 직업은 '+WT[d.wt].n+' 착용 불가')}
  if(d.req){if(d.req.lv&&SAVE.lvl<d.req.lv)why.push('Lv.'+d.req.lv+' 필요');for(const k of['str','dex','int','luk'])if(d.req[k]&&SAVE.ap[k]<d.req[k])why.push(STATN[k]+' '+d.req[k]+' 필요 (현재 '+SAVE.ap[k]+')')}
  return why;
}
function gearEquip(id,slot){ // 성공 시 null, 실패 시 메시지
  const why=gearCheck(id);if(why.length)return why.join(' · ');
  for(const s in SAVE.gear)if(SAVE.gear[s]===id&&s!==slot)delete SAVE.gear[s];
  SAVE.gear[slot]=id;
  if(slot==='rh'&&is2H(id)&&SAVE.gear.lh){delete SAVE.gear.lh;G.toast('양손무기라 왼손 장비를 해제했다')}
  if(slot==='lh'&&is2H(SAVE.gear.rh)){delete SAVE.gear.rh;G.toast('양손무기를 해제하고 왼손에 착용했다')}
  return null;
}
function gearValidate(){for(const s in SAVE.gear){const id=SAVE.gear[s];if(!GEAR[id]||gearCheck(id).length)delete SAVE.gear[s]}}
function migrateGear(){
  const g=SAVE.gear;if(g.weapon){g.rh=g.weapon;delete g.weapon}if(g.acc){g.acc1=g.acc;delete g.acc}
  for(const s in g)if(!GEAR[g[s]])delete g[s];
}

function drawFace(g,fid,ec,t,hurt,st){
  const O=O_,ln=(w=1.8)=>{g.strokeStyle=O;g.lineWidth=w;g.lineCap='round';g.lineJoin='round'};
  const eye=(ex,ey,s=1)=>{g.beginPath();g.ellipse(ex,ey,3.6*s,4.8*s,0,0,6.28);g.fillStyle='#1a1220';g.fill();g.beginPath();g.ellipse(ex,ey+1.4*s,2.6*s,2.8*s,0,0,6.28);g.fillStyle=ec;g.fill();circ(g,ex+1.3*s,ey-1.8*s,1.5*s,'#fff');circ(g,ex-1.2*s,ey+2.2*s,.7*s,'#fff')};

  const blush=(a=.38)=>{g.fillStyle=`rgba(255,120,120,${a})`;g.beginPath();g.ellipse(-11,10,3.6,2.2,0,0,6.28);g.ellipse(11,10,3.6,2.2,0,0,6.28);g.fill()};
  const smile=()=>{ln(1.6);g.beginPath();g.moveTo(-2.4,12);g.quadraticCurveTo(0,14,2.4,12);g.stroke()};
  const openM=(w=3,h=4,col='#c04a5a')=>{ln(1.6);g.beginPath();g.moveTo(-w,11.5);g.quadraticCurveTo(0,11.5+h*2,w,11.5);g.closePath();g.fillStyle=col;g.fill();g.stroke()};
  const blink=Math.sin(t*1.7+fid)>.985;
  if(hurt){for(const s of[-1,1]){const ex=s*7.5;ln(2);g.beginPath();g.moveTo(ex-3,1);g.lineTo(ex+3,7);g.moveTo(ex+3,1);g.lineTo(ex-3,7);g.stroke()}blush(.3);ln(1.6);g.beginPath();g.arc(0,13,2.4,0,6.28);g.fillStyle='#a04050';g.fill();g.stroke();return}

    case 1: for(const s of[-1,1])arcEye(s*7.5,4,true);blush(.5);openM(3.4,3.6);break;

    case 3: eye(-7.5,4,1.25);eye(7.5,5,.6);blush(.25);openM(3,3,'#c04a5a');ell(g,1.5,15.5,2.2,2.6,'#ff7a8a',O,1.2);break;
    case 4: for(const s of[-1,1]){eye(s*7.5,5,.9);g.fillStyle=SKINC;g.fillRect(s*7.5-4.5,-1.5,9,4.5);ln(1.8);g.beginPath();g.moveTo(s*7.5-4,2.8);g.lineTo(s*7.5+4,2.8);g.stroke()}blush(.3);ln(1.6);g.beginPath();g.moveTo(-3,13);g.quadraticCurveTo(2,13.5,4,10.5);g.stroke();break;
    case 5: for(const s of[-1,1]){circ(g,s*7.5,4,4.4,'#fff',O,1.6);circ(g,s*7.5,4,1.4,'#1a1220')}ln(1.6);g.beginPath();g.ellipse(0,13,2.4,3,0,0,6.28);g.fillStyle='#7a2a3a';g.fill();g.stroke();break;
    case 6: for(const s of[-1,1])lineEye(s*7.5,5);blush(.3);smile();if(Math.sin(t*2)>0)txt(g,'z',16,-10+Math.sin(t*2)*2,9,'#6a8ad0','left',2);break;
    case 7: for(const s of[-1,1]){g.save();g.translate(s*7.5,4);const k=1+Math.sin(t*8)*.08;g.scale(k,k);g.beginPath();g.moveTo(0,4);g.bezierCurveTo(-6,0,-4,-5,0,-2.4);g.bezierCurveTo(4,-5,6,0,0,4);g.fillStyle='#ff4a7a';g.fill();g.lineWidth=1.2;g.strokeStyle=O;g.stroke();g.restore()}blush(.5);openM(2.6,3);break;
    case 8: for(const s of[-1,1]){ln(2.2);g.beginPath();g.moveTo(s*7.5-3.5*s,1);g.lineTo(s*7.5+2.5*s,4);g.lineTo(s*7.5-3.5*s,7);g.stroke()}blush(.55);openM(4,4.5);break;
    case 9: for(const s of[-1,1])circ(g,s*7,4,1.8,'#1a1220');ln(1.4);g.beginPath();g.moveTo(-2,12.5);g.lineTo(2,12.5);g.stroke();break;
    case 10: for(const s of[-1,1]){arcEye(s*7.5,4,false);g.fillStyle='rgba(120,190,255,.8)';g.fillRect(s*7.5-1.5,6,3,10+Math.sin(t*6+s)*2)}ln(1.6);g.beginPath();g.moveTo(-4,13);for(let i=0;i<4;i++)g.lineTo(-4+(i+1)*2,i%2?13:11.5);g.stroke();break;

    case 12: for(const s of[-1,1]){blink?arcEye(s*7.5,4,false):eye(s*7.5,4,.9)}blush(.4);ln(1.5);g.beginPath();g.moveTo(-4,11);g.quadraticCurveTo(-2,14,0,11.5);g.quadraticCurveTo(2,14,4,11);g.stroke();break;
    case 13: for(const s of[-1,1])arcEye(s*7.5,4,true);g.fillStyle='#fff';g.beginPath();g.roundRect(-5.5,10,11,5,2);g.fill();ln(1.4);g.stroke();g.beginPath();g.moveTo(-5.5,12.5);g.lineTo(5.5,12.5);for(let i=-3;i<=3;i+=3){g.moveTo(i,10);g.lineTo(i,15)}g.stroke();break;
    case 14: for(const s of[-1,1]){ln(1.3);g.beginPath();for(let a=0;a<12;a+=.3){const r=a*.38;g.lineTo(s*7.5+Math.cos(a+t*6*s)*r,4+Math.sin(a+t*6*s)*r)}g.stroke()}ln(1.5);g.beginPath();g.moveTo(-3,12.5);g.quadraticCurveTo(-1,10.5,1,12.5);g.quadraticCurveTo(3,14.5,4,12);g.stroke();break;
    case 15: for(const s of[-1,1]){eye(s*7.5,5,.9);ln(2.2);g.beginPath();g.moveTo(s*7.5-4*s,-2.5);g.lineTo(s*7.5+4*s,-.5);g.stroke()}ln(1.8);g.beginPath();g.moveTo(-3,12.5);g.lineTo(3,12.5);g.stroke();break;
    case 16: for(const s of[-1,1])eye(s*7.5,4,1.1);blush(.4);openM(3,2.4);g.fillStyle='rgba(140,200,255,.85)';g.beginPath();g.ellipse(3.6,17+Math.abs(Math.sin(t*2))*3,1.4,2.6,0,0,6.28);g.fill();break;
    case 17: for(const s of[-1,1])arcEye(s*7.5,4,false);blush(.6);ln(1.6);g.beginPath();g.ellipse(1,12.5,2,2.4,0,0,6.28);g.fillStyle='#e05a7a';g.fill();g.stroke();if(Math.sin(t*3)>.3){g.fillStyle='#ff6a9a';g.font='bold 8px sans-serif';g.fillText('♥',8,8)}break;
    case 18: for(const s of[-1,1]){eye(s*7.5,5,.85);ln(2);g.beginPath();g.moveTo(s*7.5-4*s,0);g.lineTo(s*7.5+4*s,-2);g.stroke()}ln(1.6);g.beginPath();g.moveTo(-3,14);g.quadraticCurveTo(0,11.5,3,14);g.stroke();g.fillStyle='rgba(255,120,120,.5)';g.beginPath();g.ellipse(-12,8,2.5,4,0,0,6.28);g.fill();break;
    default: eye(-7.5,4);arcEye(7.5,4,true);blush(.4);openM(3,3);ell(g,0,16,2.6,3,'#ff7a8a',O,1.2);break;
  }
}

let WSK=null,PEERS={},ONLINE_N=0,_stT=0;
function presenceConnect(){
  if(location.protocol==='file:'||WSK)return;
  try{WSK=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){WSK=null;return}
  WSK.onopen=()=>presenceHello();
  WSK.onmessage=e=>{let o;try{o=JSON.parse(e.data)}catch(_){return}
    if(o.t!=='peers')return;ONLINE_N=o.online;const seen={};
    for(const p of o.peers){seen[p.id]=1;const q=PEERS[p.id];if(q){if(q.tg.map!==p.map||Math.hypot(p.x-q.x,p.y-q.y)>500){q.x=p.x;q.y=p.y}q.tg=p}else PEERS[p.id]={tg:p,x:p.x,y:p.y,t:Math.random()*5}}
    for(const k in PEERS)if(!seen[k])delete PEERS[k]};
  WSK.onclose=()=>{WSK=null;PEERS={};ONLINE_N=0;setTimeout(presenceConnect,4000)};
  WSK.onerror=()=>{};
}
function presenceHello(){if(WSK&&WSK.readyState===1&&ACCT)WSK.send(JSON.stringify({t:'hello',token:ACCT.token}))}
const stateOf=p=>p.dead?'idle':p.stun>0?'hurt':p.skillT>0&&p.atkT<=0?'skill':p.atkT>0?'atk':p.rope?'climb':!p.onGround?'air':Math.abs(p.vx)>30?'run':'idle';
function presenceStep(dt){
  for(const k in PEERS){const q=PEERS[k],k2=Math.min(1,dt*12);q.x+=(q.tg.x-q.x)*k2;q.y+=(q.tg.y-q.y)*k2;q.t+=dt}
  if(!WSK||WSK.readyState!==1||!S||!PARTY[0]||G.state!=='play')return;
  _stT-=dt;if(_stT>0)return;_stT=.1;
  const p=PARTY[0];
  WSK.send(JSON.stringify({t:'st',map:S.id,x:Math.round(p.x),y:Math.round(p.y),f:p.face,s:stateOf(p),j:SAVE.job,ti:SAVE.tier,fi:SAVE.fid|0,lv:SAVE.lvl,eq:p.eq}));
}

   DREAM : 몽환 컨셉 — 피아노 BGM · 꿈결 연출 · 기괴한 보스 · 새 타이틀

/* ---------- 아련한 피아노 BGM ---------- */
let REV=null,DLY=null;
function dreamAudio(){
  if(!AC||REV)return;
  // 리버브 : 감쇠 노이즈 임펄스
  const len=AC.sampleRate*3.2,buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  REV=AC.createConvolver();REV.buffer=buf;const wet=AC.createGain();wet.gain.value=.55;REV.connect(wet);wet.connect(master);
  // 잔향 딜레이
  DLY=AC.createDelay(1);DLY.delayTime.value=.42;const fb=AC.createGain();fb.gain.value=.28;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  DLY.connect(lp);lp.connect(fb);fb.connect(DLY);lp.connect(REV);
}
function piano(f,dur,vol,delay=0,bright=1){
  if(!AC||muted)return;dreamAudio();
  const t0=AC.currentTime+delay,g=AC.createGain(),flt=AC.createBiquadFilter();
  flt.type='lowpass';flt.frequency.setValueAtTime(Math.min(9000,f*7*bright),t0);flt.frequency.exponentialRampToValueAtTime(Math.max(300,f*1.6),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.006);g.gain.exponentialRampToValueAtTime(vol*.35,t0+.25);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);
  for(const[m,v,tp]of[[1,1,'triangle'],[2,.28,'sine'],[3,.08,'sine'],[1.003,.35,'sine']]){const o=AC.createOscillator(),og=AC.createGain();o.type=tp;o.frequency.value=f*m;og.gain.value=v;o.connect(og);og.connect(flt);o.start(t0);o.stop(t0+dur+.05)}
  flt.connect(g);g.connect(musGain);g.connect(REV);if(DLY)g.connect(DLY);
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
// 테마별 화성 진행 (MIDI 음 목록) · 템포
const SONGS={
  field:{bpm:64,chords:[[53,60,64,69],[57,60,64,67],[50,57,60,65],[58,62,65,69],[53,60,64,69],[52,59,64,67],[50,57,60,65],[55,62,65,70]],scale:[0,2,4,7,9],root:65},
  sky:{bpm:58,chords:[[51,58,62,67],[48,55,58,63],[56,60,63,67],[58,62,65,70],[51,58,62,67],[55,58,62,67],[53,56,60,65],[58,62,65,68]],scale:[0,2,3,7,10],root:63},
  boss:{bpm:84,chords:[[38,50,53,57],[34,46,50,53],[43,50,55,58],[45,49,52,57],[38,50,53,56],[34,46,49,53],[43,50,55,57],[45,51,52,57]],scale:[0,1,3,6,7,10],root:62},
};
function startMusic(theme){
  MUS.theme=theme;MUS.want=true;stopMusic(true);if(!AC)return;dreamAudio();
  const S2=SONGS[theme==='boss'?'boss':theme==='sky'?'sky':'field'];MUS.song=S2;MUS.step=0;MUS.mel=2;
  MUS.timer=setInterval(()=>{try{musicStep()}catch(e){}},60000/S2.bpm/2);
}
function musicStep(){
  if(!AC||muted||G.paused)return;
  const S2=MUS.song;if(!S2)return;const s=MUS.step++,i=s%8,bar=Math.floor(s/8),ch=S2.chords[bar%S2.chords.length],boss=S2===SONGS.boss;
  // 왼손 : 넓게 펼친 아르페지오
  const arp=[0,1,2,3,2,1,2,3];
  if(i===0)piano(NOTE(ch[0]-12),3.6,boss?.12:.09,0,.6);
  piano(NOTE(ch[arp[i]]),boss?.9:2.4,boss?.05:.045,0,.8);
  // 오른손 : 느린 선율 (랜덤 워크, 4/8박 위주)
  const play=boss?(i%2===0&&Math.random()<.55):(i===0||i===3||(i===6&&Math.random()<.6)||(i===5&&Math.random()<.2));
  if(play){
    MUS.mel=clamp(MUS.mel+[-2,-1,-1,0,1,1,2][Math.random()*7|0],0,S2.scale.length*2-1);
    const deg=MUS.mel%S2.scale.length,oct=Math.floor(MUS.mel/S2.scale.length);
    let n=S2.root+12+S2.scale[deg]+oct*12;
    if(i===0&&!boss){const top=ch[3]+12;if(Math.abs(n-top)<5)n=top}
    piano(NOTE(n),boss?1.2:3.2,boss?.06:.07,0,1.2);
    if(!boss&&Math.random()<.25)piano(NOTE(n+12),2.8,.025,.02,1.5);            // 반짝이는 옥타브
  }
  if(boss){ // 기괴한 저음 · 불협 오르골
    if(i===0)tone(NOTE(ch[0]-24),2.2,'sawtooth',.02,-8,0,musGain);
    if(i===4&&Math.random()<.5)piano(NOTE(S2.root+30+(Math.random()<.5?6:1)),1.6,.03,0,2);
    if(i===2||i===6)noise(.08,.04,600,0,musGain);
  }else if(i===7&&bar%4===3)piano(NOTE(S2.root+36),3,.02,0,2);             // 꿈결 종소리
}

  const mg=g.createRadialGradient(mx-m.r*.3,my-m.r*.3,m.r*.1,mx,my,m.r);mg.addColorStop(0,'#ffffff');mg.addColorStop(1,m.c);g.fillStyle=mg;g.beginPath();g.arc(mx,my,m.r,0,6.2832);g.fill();

/* ---------- 데미지 숫자 (메이플풍 · 오리지널 스타일) ---------- */
function drawDmgText(g,tx){
  const s=String(tx.txt),a=clamp(tx.life/tx.max*1.6,0,1),age=tx.max-tx.life,pop=age<.12?1.35-age*3:1;
  if(!/^\d+$/.test(s)){g.globalAlpha=a;txt(g,s,tx.x,tx.y,tx.size,tx.col,'center',4);g.globalAlpha=1;return}
  const crit=tx.size>=22,sz=tx.size*1.25*pop;
  g.save();g.globalAlpha=a;g.translate(tx.x,tx.y);g.rotate(crit?-.06:0);
  g.font=`${sz}px ${FONT}`;g.textAlign='center';g.lineJoin='round';
  g.lineWidth=sz*.28;g.strokeStyle=crit?'#5a1050':'#5a2a10';g.strokeText(s,0,0);
  const gr=g.createLinearGradient(0,-sz*.8,0,0);
  if(crit){gr.addColorStop(0,'#fff0ff');gr.addColorStop(.5,'#ff8ad8');gr.addColorStop(1,'#c040ff')}else{gr.addColorStop(0,'#fffbe0');gr.addColorStop(.5,'#ffd34a');gr.addColorStop(1,'#ff8a2a')}
  g.fillStyle=gr;g.fillText(s,0,0);
  if(crit){g.font=`${sz*.5}px ${FONT}`;g.fillStyle='#fff';g.fillText('✦',-g.measureText(s).width*1.2-6,-sz*.5)}
  g.restore();
}
