</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
 <div class="b" data-k="ArrowLeft" style="left:14px;bottom:70px">◀</div>
 <div class="b" data-k="ArrowRight" style="left:90px;bottom:70px">▶</div>

 <div class="b" data-k="ArrowDown" style="left:52px;bottom:6px">▼</div>
 <div class="b" data-k="Space" style="right:14px;bottom:70px">점프</div>
 <div class="b" data-k="KeyZ" style="right:82px;bottom:30px">공격</div>
 <div class="b" data-k="KeyX" style="right:150px;bottom:70px;width:48px;height:48px">X</div>
 <div class="b" data-k="KeyC" style="right:96px;bottom:112px;width:48px;height:48px">C</div>

 <div class="b" data-k="Escape" style="left:222px;bottom:6px;width:46px;height:46px">취소</div>
 <div class="b" data-k="KeyQ" style="right:14px;top:8px;width:42px;height:42px">Q</div>
 <div class="b" data-k="KeyI" style="right:62px;top:8px;width:42px;height:42px">I</div>
 <div class="b" data-k="KeyE" style="right:110px;top:8px;width:42px;height:42px">E</div>

<script>
'use strict';
/* ============================================================
   야채부락리 온라인 : 야채 무기 대모험  —  single-file canvas platformer
   ============================================================ */
const WSC=.6;
const W=960,H=540,GRAV=1900;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let SC=1;
function resize(){
  const f=Math.min(innerWidth/W,innerHeight/H),d=window.devicePixelRatio||1;
  cv.style.width=Math.floor(W*f)+'px';cv.style.height=Math.floor(H*f)+'px';
  cv.width=Math.round(W*f*d);cv.height=Math.round(H*f*d);SC=f*d;
}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const sgn=v=>v<0?-1:1;
const approach=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n)};

/* ---------------- input ---------------- */
const keys={};let pressed={};
const K={
  left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],
  jump:['Space','AltLeft','AltRight','KeyK'],atk:['KeyZ','ControlLeft','ControlRight','KeyJ'],
  sk1:['KeyX'],sk2:['KeyC'],sk3:['KeyV'],ok:['Enter','Space'],pause:['KeyP','Escape'],mute:['KeyM']
};
const held=n=>K[n].some(c=>keys[c]);
const tap=n=>K[n].some(c=>pressed[c]);
const PREVENT=['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','AltLeft','AltRight','ControlLeft'];
addEventListener('keydown',e=>{
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;   // 로그인 창 입력 중에는 게임 키 무시
  if(PREVENT.includes(e.code))e.preventDefault();
  if(!e.repeat)pressed[e.code]=true;
  keys[e.code]=true;initAudio();
});
addEventListener('keyup',e=>{if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
/* touch controls */
(function(){
  const box=document.getElementById('touch');
  if(!box)return;
  const coarse=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
  if(coarse)box.style.display='block';
  box.querySelectorAll('[data-k]').forEach(b=>{
    const code=b.dataset.k;
    const on=e=>{e.preventDefault();keys[code]=true;pressed[code]=true;b.classList.add('on');initAudio()};
    const off=e=>{e.preventDefault();keys[code]=false;b.classList.remove('on')};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
    b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
  });
  cv.addEventListener('pointerdown',()=>{initAudio();if(G.state!=='play'){pressed['Enter']=true}});
})();

/* ---------------- audio ---------------- */
let AC=null,master=null,musGain=null,noiseBuf=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.55;master.connect(AC.destination);
    musGain=AC.createGain();musGain.gain.value=.5;musGain.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    if(MUS.want)startMusic(MUS.theme);
  }catch(e){AC=null}
}
function tone(f,d,type='square',vol=.1,slide=0,delay=0,dest){
  if(!AC||muted)return;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t0+d);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+d+.02);
}
function noise(d,vol=.1,freq=1000,delay=0,dest){
  if(!AC||muted||!noiseBuf)return;
  const t0=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  s.connect(f);f.connect(g);g.connect(dest||master);s.start(t0);s.stop(t0+d+.02);
}
const SFX={
  jump(){tone(320,.16,'square',.06,380)},
  land(){noise(.07,.07,450)},
  atk(){noise(.12,.09,2400);tone(240,.1,'sawtooth',.04,-140)},
  hit(){noise(.1,.16,900);tone(170,.1,'square',.09,-90)},
  crit(){noise(.14,.2,1500);tone(420,.16,'sawtooth',.09,-250)},
  hurt(){tone(210,.28,'sawtooth',.12,-150);noise(.16,.1,400)},
  skill(){tone(110,.55,'sawtooth',.12,320);noise(.45,.14,300)},
  throw(){tone(560,.12,'triangle',.07,-260)},
  pickup(){tone(660,.08,'square',.06);tone(990,.12,'square',.06,0,.07)},
  lvl(){[523,659,784,1046].forEach((f,i)=>tone(f,.28,'triangle',.11,0,i*.1))},
  roar(){tone(95,.95,'sawtooth',.16,-45);noise(.85,.12,220)},
  boom(){tone(75,.55,'sine',.24,-45);noise(.5,.2,260)},
  warn(){tone(880,.07,'square',.04)},
  fire(){tone(720,.22,'sawtooth',.045,-420)},
  die(){tone(320,.9,'sawtooth',.11,-260)},
  portal(){[392,523,659,784].forEach((f,i)=>tone(f,.45,'sine',.1,0,i*.08))},
  flag(){tone(523,.12,'triangle',.1);tone(784,.22,'triangle',.1,0,.1)},
  sel(){tone(620,.05,'square',.05)},
  beam(){tone(1200,.4,'sawtooth',.06,-900);noise(.3,.1,3000)},
};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}

/* simple generative BGM : 평조 (pentatonic) + 장구 style percussion */
const MUS={timer:null,theme:'field',step:0,want:false};
const SCALES={field:[0,2,5,7,9],sky:[0,2,4,7,9],boss:[0,1,5,7,8]};
function mf(base,semi){return base*Math.pow(2,semi/12)}
function startMusic(theme){
  MUS.theme=theme;MUS.want=true;
  stopMusic(true);
  if(!AC)return;
  const bpm=theme==='boss'?156:theme==='sky'?112:98;
  MUS.step=0;
  MUS.timer=setInterval(()=>{try{musicStep()}catch(e){}},60000/bpm/2);
}
function stopMusic(keep){if(MUS.timer)clearInterval(MUS.timer);MUS.timer=null;if(!keep)MUS.want=false}
const PHRASES={
  field:[[0,2,4,2,3,1,2,-1],[4,3,2,0,1,2,3,-1],[0,0,2,4,5,4,2,-1],[3,2,1,0,2,-1,0,-1]],
  sky:[[2,4,5,4,2,1,0,-1],[0,2,4,6,5,4,2,-1],[4,5,6,5,4,2,4,-1],[0,-1,2,4,2,1,0,-1]],
  boss:[[0,0,1,0,3,2,1,0],[4,3,2,1,0,1,2,3],[0,2,0,3,0,4,3,1],[5,4,3,2,1,0,0,-1]]
};
function musicStep(){
  if(!AC||muted||G.paused)return;
  const th=MUS.theme,sc=SCALES[th],s=MUS.step++,bar=Math.floor(s/8)%4,i=s%8;
  const base=th==='boss'?146.8:th==='sky'?164.8:130.8;
  // bass
  if(i%4===0){const deg=[0,0,3,2][bar];tone(mf(base/2,sc[deg%5]),.34,'triangle',.16,0,0,musGain)}
  // percussion (장구 / 북)
  if(i===0||(th==='boss'&&i===4)||(i===4&&th!=='boss')){tone(120,.16,'sine',.3,-80,0,musGain)}
  if(i===2||i===6||(th==='boss'&&i%2===1))noise(.05,th==='boss'?.1:.07,3500,0,musGain);
  // melody (가야금 pluck)
  const ph=PHRASES[th][(bar+(Math.floor(s/32)%2))%4],n=ph[i];
  if(n>=0){const oct=n>=5?12:0;tone(mf(base*2,sc[n%5]+oct+(n>=5?0:0)),.42,'triangle',.13,0,0,musGain);
    if(th!=='boss'&&i%2===0)tone(mf(base*4,sc[n%5]),.2,'sine',.04,0,.02,musGain)}
  if(th==='boss'&&i===0)tone(mf(base,0),.9,'sawtooth',.035,-6,0,musGain);
}

/* ---------------- particles / text ---------------- */
const parts=[],texts=[];
function spark(x,y,n,col,spd=200,life=.5,size=3,grav=500,glow=false){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=spd*(.3+Math.random()*.7);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-spd*.2,life:life*(.6+Math.random()*.6),max:life,size:size*(.6+Math.random()*.8),col,grav,glow});
  }
  while(parts.length>900)parts.shift();
}
function dust(x,y,n=6,col='rgba(220,200,170,'){
  for(let i=0;i<n;i++)parts.push({x:x+rnd(-10,10),y,vx:rnd(-60,60),vy:rnd(-50,-10),life:.45,max:.45,size:rnd(3,6),col,grav:-20,soft:true});
}
function ftext(x,y,txt,col='#fff',size=18,life=.9){texts.push({x,y,txt,col,size,life,max:life,vy:-70})}
/* ============================================================
   ART : backgrounds, platforms, characters (all procedural)
   ============================================================ */
const O_='#4a3360';
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function circ(g,x,y,r,fill,stroke,lw){g.beginPath();g.arc(x,y,r,0,6.2832);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=lw||2;g.strokeStyle=stroke;g.stroke()}}
function ell(g,x,y,rx,ry,fill,stroke,lw,rot=0){g.beginPath();g.ellipse(x,y,rx,ry,rot,0,6.2832);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=lw||2;g.strokeStyle=stroke;g.stroke()}}
function limb(g,x1,y1,x2,y2,w,col){g.lineCap='round';g.lineJoin='round';g.strokeStyle=O_;g.lineWidth=w+4;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function limb2(g,x1,y1,xm,ym,x2,y2,w,col){g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(xm,ym);g.lineTo(x2,y2);g.strokeStyle=O_;g.lineWidth=w+4;g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke()}
function poly(g,pts,fill,stroke,lw){g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=lw||2;g.lineJoin='round';g.strokeStyle=stroke;g.stroke()}}

/* ---------------- themes / backgrounds ---------------- */
const THEMES={
  forest:{sun:1,sky:['#8a7ae8','#c8a8f4','#ffd0ec','#fff0e0'],moon:{x:.78,y:.2,r:46,c:'#fff6fc',glow:'rgba(255,220,250,'},
    layers:[{k:'clouds',col:'#fff4fd',base:.42,f:.04},{k:'ridge',col:'#b8a8ec',amp:70,base:.62,f:.08,cyc:[2,5,9]},{k:'ridge',col:'#9ad0d8',amp:60,base:.74,f:.16,cyc:[3,7,11]},
            {k:'pines',col:'#78bcb8',base:.86,f:.3,hh:[90,170],n:26},{k:'pines',col:'#589a9e',base:.98,f:.55,hh:[130,240],n:15}],
    grass:'#a8f0c8',grass2:'#6ac4a4',dirt:'#c09ab8',dirt2:'#9a7498',stone:'#c8b8d8',plank:'#e0b8c8',plank2:'#a07898',fly:'#fff6c8'},
  sky:{sun:1,sky:['#6a8af0','#a8b8ff','#ffd0f0','#fff4ea'],moon:{x:.2,y:.24,r:52,c:'#fffaff',glow:'rgba(255,230,255,'},
    layers:[{k:'clouds',col:'#ffffff',base:.5,f:.05},{k:'islands',col:'#c0b0f0',base:.64,f:.1},{k:'clouds',col:'#ffe8f8',base:.84,f:.24},{k:'clouds',col:'#ffffff',base:1.02,f:.42}],
    grass:'#c8f4e8',grass2:'#88d0c0',dirt:'#c8b8f0',dirt2:'#9a88d0',stone:'#d8d0f8',plank:'#e8e0ff',plank2:'#a8a0e0',fly:'#ffffff'},
  night:{sky:['#1a1050','#4a2a98','#a85ab8','#f0a0c0'],moon:{x:.5,y:.26,r:70,c:'#ffeefa',glow:'rgba(255,200,250,'},
    layers:[{k:'ridge',col:'#4a3a98',amp:80,base:.64,f:.06,cyc:[2,4,7]},{k:'pines',col:'#33287a',base:.86,f:.28,hh:[80,150],n:24},{k:'gates',col:'#7a3a8a',base:.98,f:.5}],
    grass:'#c0a8ff',grass2:'#7a60c8',dirt:'#4a3a80',dirt2:'#32285e',stone:'#8a80c0',plank:'#b08ad0',plank2:'#6a4a90',fly:'#ffe8ff'},
  lava:{sky:['#3a0a10','#7a1a14','#d04a1a','#ffb060'],moon:{x:.62,y:.86,r:120,c:'#ff9a4a',glow:'rgba(255,120,40,'},
    layers:[{k:'ridge',col:'#5a1a14',amp:120,base:.5,f:.06,cyc:[2,3,8]},{k:'ridge',col:'#3a0e0a',amp:90,base:.7,f:.16,cyc:[3,5,13]},{k:'gates',col:'#6a1408',base:.96,f:.45}],
    grass:'#ff8a3a',grass2:'#b8401a',dirt:'#5a2c20',dirt2:'#3a1a14',stone:'#7a4a40',plank:'#9a5a38',plank2:'#5a2c18',fly:'#ffd080'},
};
const LW=1200,LHT=330;
const BGCACHE={};
function getBG(name){if(!BGCACHE[name])BGCACHE[name]=buildBG(name);return BGCACHE[name]}
function buildBG(name){
  const T=THEMES[name],r=mulberry(name.length*97+3);
  const sky=mk(W,H),g=sky.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,H);T.sky.forEach((c,i)=>gr.addColorStop(i/(T.sky.length-1),c));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<140;i++){g.globalAlpha=.25+r()*.75;g.fillStyle='#fff';const s=r()<.12?2:1;g.fillRect(r()*W,r()*H*.62,s,s)}
  g.globalAlpha=1;
  const m=T.moon,mx=m.x*W,my=m.y*H;
  const rg=g.createRadialGradient(mx,my,m.r*.5,mx,my,m.r*3.2);rg.addColorStop(0,m.glow+'.5)');rg.addColorStop(1,m.glow+'0)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);
  g.fillStyle=m.c;g.beginPath();g.arc(mx,my,m.r,0,6.2832);g.fill();
  const sun=!!T.sun;
  if(sun){g.strokeStyle='rgba(255,250,200,.5)';g.lineWidth=4;for(let i=0;i<12;i++){const a=i/12*6.283;g.beginPath();g.moveTo(mx+Math.cos(a)*m.r*1.25,my+Math.sin(a)*m.r*1.25);g.lineTo(mx+Math.cos(a)*m.r*1.6,my+Math.sin(a)*m.r*1.6);g.stroke()}}
  g.fillStyle=sun?'rgba(255,255,255,0)':'rgba(60,20,40,.10)';
  for(let i=0;i<7;i++){g.beginPath();g.arc(mx+(r()-.5)*m.r*1.2,my+(r()-.5)*m.r*1.2,m.r*(.07+r()*.13),0,6.2832);g.fill()}
  const layers=T.layers.map(Ly=>{

      g.fillStyle=T.dirt2;for(let xx=x;xx<x+w;xx+=34){const d=18+hash(xx)*34;poly(g,[xx,y+hh-2,xx+34,y+hh-2,xx+17,y+hh+d],T.dirt2)}
    }

  }
  // one-way
  const sky=T===THEMES.sky,cr=pl.crumble;

  if(cr&&cr.timer>0&&!cr.fall){ox=Math.sin(t*90)*1.6}
  if(cr&&cr.fall){oy=cr.fy;g.globalAlpha=clamp(1-cr.fy/160,0,1)}
  g.save();g.translate(ox,oy);
  if(sky){
    const gr=g.createLinearGradient(0,y,0,y+16);gr.addColorStop(0,T.plank);gr.addColorStop(1,T.plank2);
    g.fillStyle=gr;g.beginPath();g.roundRect(x,y,w,16,5);g.fill();g.lineWidth=2;g.strokeStyle=O_;g.stroke();

    // cloud wisps below
    g.fillStyle='rgba(255,210,220,.22)';for(let i=0;i<3;i++)ell(g,x+w*(.2+.3*i)+Math.sin(t+i)*6,y+22,w*.14,6);
  }else{
    const gr=g.createLinearGradient(0,y,0,y+16);gr.addColorStop(0,T.plank);gr.addColorStop(1,T.plank2);
    g.fillStyle=gr;g.beginPath();g.roundRect(x,y,w,16,7);g.fill();g.lineWidth=2;g.strokeStyle=O_;g.stroke();
    g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;for(let xx=x+10;xx<x+w-6;xx+=17){g.beginPath();g.moveTo(xx,y+4);g.lineTo(xx+6,y+12);g.stroke()}
    ell(g,x+3,y+8,5,8,T.plank,O_,1.5);ell(g,x+3,y+8,2,4,null,'rgba(0,0,0,.4)',1);
    ell(g,x+w-3,y+8,5,8,T.plank,O_,1.5);ell(g,x+w-3,y+8,2,4,null,'rgba(0,0,0,.4)',1);
    g.fillStyle=T.grass;for(let xx=x+8;xx<x+w-8;xx+=11){const k=hash(xx*.7);if(k>.35){g.beginPath();g.ellipse(xx,y+1,5+k*4,3,0,0,6.2832);g.fill()}}

function interpA(A,l){l=Math.max(1,Math.min(99,l));for(let i=1;i<A.length;i++){if(l<=A[i][0]){const a=A[i-1],b=A[i],k=(l-a[0])/Math.max(1,b[0]-a[0]);return Math.exp(Math.log(a[1])+(Math.log(b[1])-Math.log(a[1]))*k)}}return A[A.length-1][1]}

let SAVE=null;
/* ---------------- 계정 / 클라우드 저장 (서버가 없으면 게스트 로컬 저장) ---------------- */
let ACCT=null;                         // {name,token}
const TOKKEY='cgdd_acct_v1';
const skey=()=>ACCT?SAVEKEY+':'+ACCT.name.toLowerCase():SAVEKEY;
async function api(method,path,body){
  const r=await fetch(path,{method,headers:Object.assign({'content-type':'application/json'},ACCT?{authorization:'Bearer '+ACCT.token}:{}),body:body?JSON.stringify(body):undefined});
  let o={};try{o=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(o.error||('서버 오류 ('+r.status+')')),{status:r.status});
  return o;
}
let _cloudT=0,CLOUD={ok:null,at:0};
function cloudSave(now){
  if(!ACCT||!SAVE)return;clearTimeout(_cloudT);
  const go=async()=>{try{await api('PUT','/api/save',{save:SAVE});CLOUD={ok:true,at:Date.now()}}catch(e){CLOUD={ok:false,at:Date.now(),err:e.message};if(e.status===401){ACCT=null;try{localStorage.removeItem(TOKKEY)}catch(_){}}}};
  if(now)go();else _cloudT=setTimeout(go,1500);
}
function saveGame(){
  if(!SAVE)return;SAVE.ts=Date.now();
  try{localStorage.setItem(skey(),JSON.stringify(SAVE))}catch(e){}
  cloudSave();
}
addEventListener('pagehide',()=>{if(ACCT&&SAVE){try{fetch('/api/save',{method:'PUT',keepalive:true,headers:{'content-type':'application/json',authorization:'Bearer '+ACCT.token},body:JSON.stringify({save:SAVE})})}catch(e){}}});
function readLocal(key){try{const s=localStorage.getItem(key);return s?JSON.parse(s):null}catch(e){return null}}
function loadGame(){
  let o=readLocal(skey()),old=false;
  if(!o&&!ACCT){o=readLocal(OLDKEY);old=!!o}
  if(o&&o.job&&JOB[o.job]){
    if(old){o.tier=Math.max(1,o.tier||1);o.q=o.q||{};o.q.j1={s:'done',p:[]};for(const k of['j2','j3'])if(o.q[k]&&o.q[k].s!=='done')delete o.q[k]}   // v2 → v3 이전
    return o}
  return null;
}
// 로그인 직후: 서버 저장과 로컬 저장 중 최신 것을 채택. 서버가 비어 있으면 게스트 저장을 계정으로 이전.
async function syncAfterLogin(){
  const srv=await api('GET','/api/save');
  const loc=readLocal(skey()),guest=readLocal(SAVEKEY)||readLocal(OLDKEY);
  if(srv.save&&(!loc||(srv.save.ts||0)>=(loc.ts||0))){try{localStorage.setItem(skey(),JSON.stringify(srv.save))}catch(e){}return'server'}
  const up=loc||guest;
  if(up){if(!up.ts)up.ts=Date.now();try{localStorage.setItem(skey(),JSON.stringify(up))}catch(e){}await api('PUT','/api/save',{save:up});return loc?'local':'guest'}
  return'none';
}
function setAcct(a){ACCT=a;try{a?localStorage.setItem(TOKKEY,JSON.stringify(a)):localStorage.removeItem(TOKKEY)}catch(e){}}
async function autoLogin(){
  const a=readLocal(TOKKEY);if(!a||!a.token)return;
  ACCT=a;
  try{const me=await api('GET','/api/me');ACCT.name=me.name;await syncAfterLogin();CLOUD={ok:true,at:Date.now()};refreshMe()}
  catch(e){if(e.status===401)setAcct(null);else ACCT=null}   // 서버 없음(정적 호스팅) → 게스트
}
/* 로그인 창 (DOM 오버레이) */
function openAuth(onDone){
  if(document.getElementById('auth'))return;
  const d=document.createElement('div');d.id='auth';
  d.innerHTML=`<div class="box"><h2>☁ 채근담담에 어서 와요</h2>
   <p class="sub">${ACCT?'로그인됨: <b>'+ACCT.name+'</b>':'이름과 비밀번호만 있으면 어디서든 이어서 놀 수 있어요'}</p>
   ${ACCT?'':'<input id="a_n" placeholder="이름 (한글/영문/숫자 2~12자)" maxlength="12" autocomplete="username"><input id="a_p" type="password" placeholder="비밀번호 (4자 이상)" maxlength="64" autocomplete="current-password">'}
   <div class="msg" id="a_m"></div>
   <div class="row">${ACCT?'<button id="a_out">로그아웃</button>':'<button id="a_in">로그인</button><button id="a_up">회원가입</button>'}<button id="a_x" class="g">${ACCT?'닫기':'게스트로 계속'}</button></div></div>`;
  document.body.appendChild(d);
  const $=i=>d.querySelector('#'+i),msg=t=>{$('a_m').textContent=t};
  const close=()=>{d.remove();pressed={};onDone&&onDone()};
  $('a_x').onclick=close;
  if(ACCT){$('a_out').onclick=()=>{setAcct(null);close()};return}
  const go=async kind=>{
    const name=$('a_n').value.trim(),password=$('a_p').value;
    if(!name||!password){msg('이름과 비밀번호를 입력하세요');return}
    msg('연결 중…');
    try{
      const o=await api('POST','/api/'+kind,{name,password});
      setAcct({name:o.name,token:o.token});const how=await syncAfterLogin();CLOUD={ok:true,at:Date.now()};refreshMe();
      msg(how==='server'?'불러오기 완료!':how==='guest'?'게스트 저장을 계정으로 옮겼어요':'완료!');setTimeout(close,500);
    }catch(e){msg(e.message==='Failed to fetch'||e instanceof TypeError?'서버에 연결할 수 없어요 (게스트로 플레이)':e.message)}
  };
  $('a_in').onclick=()=>go('login');$('a_up').onclick=()=>go('register');
  d.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go('login')}));
  setTimeout(()=>$('a_n').focus(),50);
}

function drawCape(g,id,t,st,shy){
  const it=ITEMS[id],run=st==='run',fl=(run?12:st==='air'?16:3)+Math.sin(t*(run?16:4))*(run?5:2);
  g.save();if(id==='cape_ghost')g.globalAlpha*=.72;
  g.beginPath();g.moveTo(-8,shy+1);g.quadraticCurveTo(-22-fl*.4,shy+14,-28-fl,-10);
  const bx=-28-fl,n=4;
  for(let i=1;i<=n;i++){const x=bx+(i/n)*(18+fl),y=-10+(i%2?9:2)+Math.sin(t*6+i)*2;g.lineTo(x,y)}
  g.lineTo(8,shy+1);g.closePath();
  const gr=g.createLinearGradient(0,shy,-30,-10);gr.addColorStop(0,it.col);gr.addColorStop(1,id==='cape_ghost'?'#9fb8ff':shade(it.col,-50));
  g.fillStyle=gr;g.fill();g.lineWidth=2.2;g.strokeStyle=O_;g.stroke();

  g.restore();
}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=clamp((n>>16)+amt,0,255),gg=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return`rgb(${r},${gg},${b})`}

      const ea=dir>0?cur.x+cur.w:cur.x,eb=dir>0?bx:bx+w,gp=Math.abs(eb-ea),mid=(ea+eb)/2;

/* ---------------- physics ---------------- */
function updatePlats(L,dt,t){
  for(const pl of L.plats){
    if(pl.mv){
      const m=pl.mv,nx=m.x0+Math.sin(t*m.sp+m.ph)*m.ax,ny=m.y0+Math.sin(t*m.sp+m.ph)*m.ay;
      pl.dx=nx-pl.x;pl.dy=ny-pl.y;pl.x=nx;pl.y=ny;
    }
    if(pl.crumble){
      const c=pl.crumble;
      if(c.fall){c.fy+=c.vy*dt;c.vy+=900*dt;c.back-=dt;pl.solidOff=true;if(c.back<=0){c.fall=false;c.fy=0;c.timer=0;pl.solidOff=false}}
      else if(c.timer>0){c.timer-=dt;if(c.timer<=0){c.fall=true;c.vy=0;c.back=3.2;pl.solidOff=true}}
    }
  }
}
// body : {x(center),y(feet),w,h,vx,vy,drop} -> collides with L.plats
function moveBody(L,b,dt,noOneway){
  b.x+=b.vx*dt;b.hitWall=false;
  const rect=()=>({x:b.x-b.w/2,y:b.y-b.h,w:b.w,h:b.h});
  for(const pl of L.plats){
    if(pl.t!=='s')continue;const r=rect();
    if(ov(r,pl)){if(b.vx>0)b.x=pl.x-b.w/2;else if(b.vx<0)b.x=pl.x+pl.w+b.w/2;else b.x+=(b.x<pl.x+pl.w/2?-1:1);b.vx=0;b.hitWall=true}
  }
  const pb=b.y;b.y+=b.vy*dt;const wasG=b.onGround;b.onGround=false;b.ground=null;
  for(const pl of L.plats){
    const r=rect();
    if(pl.t==='s'){
      if(ov(r,pl)){if(b.vy>=0&&pb<=pl.y+6){b.y=pl.y;b.onGround=true;b.ground=pl}else if(b.vy<0){b.y=pl.y+pl.h+b.h}b.vy=0}
    }else if(!noOneway&&!pl.solidOff&&b.vy>=0&&!(b.drop>0)&&r.x<pl.x+pl.w&&r.x+r.w>pl.x&&pb<=pl.y+5&&b.y>=pl.y){
      b.y=pl.y;b.vy=0;b.onGround=true;b.ground=pl;
    }
  }
  b.landed=b.onGround&&!wasG;
}
function groundAt(L,x,y,maxd=600){ // highest platform top below y at x
  let best=null;
  for(const pl of L.plats){if(pl.solidOff)continue;if(x>pl.x&&x<pl.x+pl.w&&pl.y>=y-4&&pl.y<y+maxd&&(!best||pl.y<best.y))best=pl}
  return best;
}

function mkPlayer(kind,jobId,lvl){
  const p={kind,job:jobId,x:0,y:0,w:20,h:36,vx:0,vy:0,face:1,onGround:false,ground:null,rope:null,rcool:0,drop:0,coyote:0,jbuf:0,
    inv:0,stun:0,atkT:0,atkCd:0,hitQ:-1,combo:0,comboT:0,cds:[0,0,0,0,0],buff:null,shieldT:0,dashT:0,dashHit:null,skillT:0,
    hp:1,mp:1,dead:false,deadT:0,t:Math.random()*5,eq:{},lvl:lvl||1,tier:0,team:0,fid:Math.random()*20|0,lastAtk:null,hold:false,ai:null,aiT:0,far:0,mpWarn:0,vyPrev:0};
  recalc(p);p.hp=p.maxhp;p.mp=p.maxmp;return p;
}
function recalc(p){
  const j=JOB[p.job],lv=p.lvl,ti=p.tier;
  p.maxhp=Math.round((j.hp+(lv-1)*13)*[1,1.15,1.4,1.8][ti]);
  p.maxmp=Math.round((j.mp+(lv-1)*4)*[1,1.1,1.25,1.5][ti]);
  p.atkBase=(j.atk+(lv-1)*2.3)*[1,1.15,1.45,1.9][ti];
  p.spdMul=1;
  if(p.kind==='p1'&&typeof SAVE!=='undefined'&&SAVE&&SAVE.ap)applyAP(p);
  if(p.kind==='p1'&&typeof SAVE!=='undefined'&&SAVE&&SAVE.gear){let a=0,h=0,m=0,sp=0;for(const sl in SAVE.gear){const id=SAVE.gear[sl];a+=gearStat(id,'atk');h+=gearStat(id,'hp');m+=gearStat(id,'mp');sp+=gearStat(id,'spd')}
    p.atkBase*=1+a/100;p.maxhp=Math.round(p.maxhp*(1+h/100));p.maxmp=Math.round(p.maxmp*(1+m/100));p.spdMul=1+sp/100}
  if(p.kind==='p1'&&typeof SAVE!=='undefined'&&SAVE&&SAVE.enh){p.maxhp=Math.round(p.maxhp*(1+SAVE.enh.hp*.015));p.atkBase*=1+SAVE.enh.atk*.012}
  p.hp=Math.min(p.hp,p.maxhp);p.mp=Math.min(p.mp,p.maxmp);
}
const atkOf=p=>p.atkBase*(p.buff?p.buff.atk:1);
const spdOf=p=>JOB[p.job].spd*(p.spdMul||1)*(p.buff?p.buff.spd:1);
const prect=p=>({x:p.x-p.w/2+2,y:p.y-p.h,w:p.w-4,h:p.h});
const alive=()=>PARTY.filter(p=>!p.dead);
const unlocked=(p,i)=>p.tier>=SK_TIER[i];
function inputOf(p){
  if(p.kind==='ai')return p.ai||NOIN;
  if(G.ui||G.state!=='play')return NOIN;
  const c=CTRL[p.kind==='p1'?0:1],h=a=>a.some(k=>keys[k]),t=a=>a.some(k=>pressed[k]);
  return {l:h(c.l),r:h(c.r),u:h(c.u),d:h(c.d),uT:t(c.u),jT:t(c.j),jH:h(c.j),a:h(c.a),aT:t(c.a),s:c.s.map(k=>!!pressed[k]),fd:0};
}

/* ---------- exp / coins ---------- */
function gainExp(n,mob){
  const p=PARTY[0];if(!p||SAVE.lvl>=MAXLV)return;
  if(mob)n=Math.max(1,Math.round(n*expMul(SAVE.lvl)*EV().exp));
  SAVE.exp+=n;ftext(p.x,p.y-78,'+'+n+' EXP','#9be8ff',14);
  while(SAVE.lvl<MAXLV&&SAVE.exp>=need(SAVE.lvl)){
    SAVE.exp-=need(SAVE.lvl);SAVE.lvl++;
    SAVE.apFree=(SAVE.apFree||0)+5;p.lvl=SAVE.lvl;recalc(p);p.hp=p.maxhp;p.mp=p.maxmp;

function spawnMob(type,x,y,o){

function nearestAlive(x,y,maxd=9999){let b=null,bd=maxd;for(const p of PARTY){if(p.dead)continue;const d=Math.hypot(p.x-x,p.y-20-y);if(d<bd){bd=d;b=p}}return b}
function updateMobs(dt){
  const L=S.L;
  for(const m of S.mobs){
    if(m.dead)continue;
    if(m.type==='arm'){m.t+=dt;m.flash-=dt;m.slam=Math.max(0,(m.slam||0)-dt);m.x=m.bx+Math.sin(m.t*1.3+m.ph)*7;m.y=m.by+Math.cos(m.t*1.1+m.ph)*6-(m.slam>0?Math.sin(m.slam/.9*Math.PI)*40:0);continue}
    m.t+=dt;m.flash-=dt;m.kbx=approach(m.kbx,0,700*dt);
    if(MOBS[m.type].fly){
      const tg=nearestAlive(m.x,m.y,m.chase?900:260);
      if(tg){m.ox+=sgn(tg.x-m.x)*(m.chase?120:50)*dt;m.by+=(tg.y-44-m.by)*(m.chase?1.1:.35)*dt}
      m.ox=clamp(m.ox,30,L.w-30);
      m.x=m.ox+Math.sin(m.t*.9+m.ph)*m.range*(tg?.4:1)+m.kbx*.1;m.y=m.by+Math.sin(m.t*1.9+m.ph)*14;
    }else{
      if(m.chase){const tg=nearestAlive(m.x,m.y-20);if(tg)m.dir=sgn(tg.x-m.x)}
      else{if(m.min!==undefined){if(m.x<m.min)m.dir=1;if(m.x>m.max)m.dir=-1}}
      m.vx=m.dir*(m.chase?(m.type==='baby'?105:80):46)+m.kbx;
      m.vy+=GRAV*dt;m.hopT-=dt;
      if(m.onGround&&m.hopT<=0){m.vy=-(m.chase?560:340);m.hopT=rnd(1.1,2.3)}
      moveBody(L,m,dt);
      if(m.hitWall)m.dir*=-1;
      m.x=clamp(m.x,22,L.w-22);
      if(m.y>L.h+300){m.dead=true}
    }

  }
  for(const m of S.mobs)if(m.dead&&m.tpl!=null&&!m.queued){m.queued=1;(S.resp=S.resp||[]).push({i:m.tpl,t:RESP_T*(S.L.hunt?.8:1)})}
  S.mobs=S.mobs.filter(m=>!m.dead);
  for(const d of S.dummies){d.flash-=dt;d.shake-=dt;if(d.hp>0){d.regen-=dt;if(d.regen<=0&&d.hp<d.max)d.hp=Math.min(d.max,d.hp+60*dt)}else{d.respawn-=dt;if(d.respawn<=0)d.hp=d.max}}
  for(const b of S.boxes)b.flash-=dt;
  // PQ spawner
  const sp=L.spawner;
  if(sp&&S.pq&&S.pq.active){
    S.spT=(S.spT||0)-dt;
    if(S.spT<=0&&S.mobs.filter(m=>!m.dead).length<sp.max){
      S.spT=sp.every;const type=sp.types[Math.random()*sp.types.length|0],x=Math.random()<.5?60:L.w-60;
      if(type==='wisp')spawnMob('wisp',x,rnd(200,380),{chase:true,range:30});else spawnMob('egg',x,470,{chase:true});
      spark(x,400,10,'#cfa8ff',160,.5,3,0,true);
    }
  }
}

/* ---------- player damage ---------- */
function hurtPlayer(p,dmg,srcx,o){
  if(p.dead||p.inv>0||p.shieldT>0||p.dashT>0||G.state!=='play')return false;
  const def=p.buff&&p.buff.def?p.buff.def:0;
  dmg=Math.max(1,Math.round(dmg*(1-def)));
  p.hp-=dmg;p.inv=o&&o.inv!==undefined?o.inv:1.0;p.stun=o&&o.stun||.2;p.vx=(sgn(p.x-srcx)||p.face*-1)*(o&&o.kb||240);p.vy=-(o&&o.up||300);p.rope=null;p.atkT=0;p.hitQ=-1;p.dashT=0;
  ftext(p.x,p.y-70,'-'+dmg,'#ff5a5a',20);sfx('hurt');spark(p.x,p.y-20,10,'#ff7a7a',200,.4);
  if(p.kind!=='ai'){S.shake=Math.max(S.shake,8);S.hitstop=Math.max(S.hitstop,.05)}
  if(p.hp<=0){p.hp=0;p.dead=true;p.deadT=0;if(S.L.pvp)pvpKO(p);else p.vx=0;sfx('die');spark(p.x,p.y-20,26,'#cfe0ff',260,.9,4,-50,true);ftext(p.x,p.y-90,'기절했다…','#cfe0ff',16,1.4)}
  return true;
}
/* ---------- PvP ---------- */
const PVP_DMG=.55;
function pvpHit(t,dmg,dir,crit,atk){
  if(t.dead||!S.pvp||S.pvp.over)return;
  const d=Math.max(1,Math.round(dmg*PVP_DMG)),ratio=d/t.maxhp,missing=1-t.hp/t.maxhp;
  // 넉백: 큰 피해 · 체력이 적을수록 더 멀리 밀려난다
  const kb=330+Math.min(560,ratio*1500)+missing*260+(crit?90:0);
  if(hurtPlayer(t,d,t.x-dir*40,{kb,up:300+Math.min(220,ratio*600),inv:.3,stun:.16+Math.min(.28,ratio*1.1),pvp:1})){
    t.lastAtk=atk;S.hitstop=Math.max(S.hitstop,crit?.07:.04);S.shake=Math.max(S.shake,crit?9:5);
    spark(t.x,t.y-30,crit?14:8,'#fff0b0',240,.35);
  }
}

}
function healPlayer(p,amt){const h=Math.min(p.maxhp-p.hp,Math.round(amt));if(h>0){p.hp+=h;ftext(p.x,p.y-70,'+'+h,'#6aff8a',18)}spark(p.x,p.y-20,10,'#8affb0',140,.6,3,-60,true)}

/* ---------- player update ---------- */
function updatePlayer(p,dt){
  p.t+=dt;p.inv=Math.max(0,p.inv-dt);p.stun=Math.max(0,p.stun-dt);p.atkCd-=dt;p.comboT-=dt;p.skillT-=dt;p.shieldT=Math.max(0,p.shieldT-dt);p.mpWarn-=dt;p.rcool-=dt;
  for(let i=0;i<5;i++)p.cds[i]=Math.max(0,p.cds[i]-dt);
  if(p.buff){p.buff.t-=dt;if(p.buff.t<=0)p.buff=null}
  const L=S.L;
  if(p.dead){
    p.deadT+=dt;
    if(L.pvp){
      p.vx=approach(p.vx,0,600*dt);
      if(p.deadT>2&&!S.pvp.over){const sp=S.L.spawns[p.team];p.dead=false;p.hp=p.maxhp;p.mp=p.maxmp;p.x=sp.x;p.y=sp.y;p.vx=p.vy=0;p.inv=2;p.stun=0;p.buff=null;p.lastAtk=null;sfx('portal');spark(p.x,p.y-20,24,'#fff7a0',260,.7,4,0,true);ftext(p.x,p.y-80,'부활!','#fff7a0',20)}
      return;
    }
    const allies=PARTY.filter(q=>!q.dead);
    if(allies.length&&p.deadT>(p.kind==='ai'?7:6)){
      const a=allies[0];p.dead=false;p.hp=Math.round(p.maxhp*.5);p.mp=p.maxmp*.5;p.x=a.x;p.y=a.y;p.vx=p.vy=0;p.inv=2;sfx('portal');spark(p.x,p.y-20,24,'#fff7a0',260,.7,4,0,true);ftext(p.x,p.y-80,'부활!','#fff7a0',20);
    }else if(!allies.length&&!L.arena&&!L.pq&&!L.town&&p.deadT>1.3){
      p.dead=false;p.hp=p.maxhp;p.mp=p.maxmp;p.x=S.cp.x;p.y=S.cp.y;p.vx=p.vy=0;p.inv=2;sfx('portal');ftext(p.x,p.y-80,'체크포인트 부활','#fff7a0',18);spark(p.x,p.y-20,20,'#fff7a0',200,.6,3,0,true)}
    else if(!allies.length&&L.town&&p.deadT>1.3){p.dead=false;p.hp=p.maxhp;p.mp=p.maxmp;p.vx=p.vy=0;p.inv=2}
    return;
  }
  if(p.kind==='ai')aiThink(p,dt);
  const I=inputOf(p);
  if(p.ground&&(p.ground.dx||p.ground.dy)){p.x+=p.ground.dx;p.y+=p.ground.dy}
  p.mp=Math.min(p.maxmp,p.mp+(2.2+(p.buff&&p.buff.mpr||0))*dt);
  const stunned=p.stun>0;
  // facing
  if(I.fd)p.face=I.fd;
  // ----- dash skill -----
  if(p.dashT>0){
    p.dashT-=dt;p.vx=p.face*720;p.vy=0;p.inv=Math.max(p.inv,.1);
    moveBody(L,p,dt);
    const r=prect(p);r.x-=14;r.w+=28;
    eachTarget(t=>{if(!p.dashHit.has(t)&&ov(r,rectOf(t))){p.dashHit.add(t);dealDamage(p,t,atkOf(p)*p.dashM,p.face)}},p);
    if(Math.random()<.8)parts.push({x:p.x-p.face*10,y:p.y-rnd(8,44),vx:0,vy:0,life:.3,max:.3,size:rnd(4,8),col:JOB[p.job].col,grav:0,glow:true});
    if(p.dashT<=0)p.vx*=.3;
    return finishPlayer(p,dt,I);
  }
  // ----- rope -----
  if(p.rope){
    const rp=p.rope;p.vx=0;p.vy=0;p.x=rp.x;
    const dy=(I.u?-1:0)+(I.d?1:0);p.y+=dy*150*dt;
    if(p.y<=rp.y1){p.y=rp.y1;p.rope=null;p.rcool=.25;if(p===PARTY[0])qev('flag','rope')}
    else if(p.y>=rp.y2){p.y=rp.y2;if(dy>0){p.rope=null;p.rcool=.2}}
    if(I.jT&&(I.l||I.r)){p.rope=null;p.rcool=.3;p.vx=(I.r?1:-1)*230;p.vy=-430;p.face=I.r?1:-1;sfx('jump')}
    p.t+=dy?dt:0;
    return finishPlayer(p,dt,I,true);
  }
  // ----- horizontal -----
  let ax=(I.l?-1:0)+(I.r?1:0);if(stunned)ax=0;
  if(ax&&!I.fd&&p.atkT<=0)p.face=ax;
  if(ax&&I.fd===0&&p.atkT>0)p.face=p.face;
  const sp=spdOf(p)*(p.atkT>0&&p.onGround?.5:1);
  if(!stunned)p.vx=approach(p.vx,ax*sp,(p.onGround?3200:1900)*dt);
  else p.vx=approach(p.vx,0,500*dt);
  // ----- jump -----
  if(I.jT)p.jbuf=.12;else p.jbuf-=dt;
  p.coyote=p.onGround?.09:p.coyote-dt;
  if(p.jbuf>0&&!stunned){
    if(I.d&&p.onGround&&p.ground&&p.ground.t==='o'&&!p.ground.big){p.drop=.28;p.y+=3;p.vy=80;p.jbuf=0;p.coyote=0;p.onGround=false}
    else if(p.coyote>0){p.vy=-JOB[p.job].jump;p.jbuf=0;p.coyote=0;p.onGround=false;sfx('jump');dust(p.x,p.y,4);if(p===PARTY[0])qev('flag','jump')}
  }
  if(!I.jH&&p.vy<-230&&!p.dashT&&!p.rope)p.vy=-230;
  p.drop-=dt;
  p.vy=Math.min(p.vy+GRAV*dt,980);
  p.vyPrev=p.vy;
  // ----- rope grab -----
  if(p.rcool<=0&&(I.u||I.d)&&!stunned){

/* ---------- player projectiles ---------- */
function updatePshots(dt){
  const L=S.L;
  for(const s of S.pshots){
    if(s.delay>0){s.delay-=dt;continue}
    s.life-=dt;s.rot+=dt*(s.kind==='star'?20:s.kind==='wave'?0:6)*(s.falling?0:1);
    if(s.homing){
      let bt=null,bd=420;eachTarget(t=>{const r=rectOf(t),d=Math.hypot(r.x+r.w/2-s.x,r.y+r.h/2-s.y);if(d<bd&&!s.hit.has(t)){bd=d;bt=r}},s.owner);
      if(bt){const a=Math.atan2(bt.y+bt.h/2-s.y,bt.x+bt.w/2-s.x),sp=Math.hypot(s.vx,s.vy)||400,ca=Math.atan2(s.vy,s.vx);let da=a-ca;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;const na=ca+clamp(da,-6*dt,6*dt);s.vx=Math.cos(na)*sp;s.vy=Math.sin(na)*sp}
    }
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.ground){const g=groundAt(L,s.x,s.y-20,60);if(g)s.y=g.y;if(Math.random()<.5)dust(s.x,s.y,1,'rgba(255,230,160,')}
    let boom=false;
    const r={x:s.x-s.w/2,y:s.y-s.h/2,w:s.w,h:s.h};
    if(s.falling){
      for(const pl of L.plats){if(pl.solidOff)continue;if(s.x>pl.x&&s.x<pl.x+pl.w&&s.y>=pl.y&&s.y-s.vy*dt<=pl.y+4){boom=true;s.y=pl.y;break}}
    }
    if(!boom)eachTarget(t=>{
      if(s.life<=0&&!boom)return;
      if(s.hit.has(t)||!ov(r,rectOf(t)))return;
      s.hit.add(t);
      if(s.aoe){boom=true;return}
      dealDamage(s.owner,t,s.dmg,sgn(s.vx||1));
      if(s.hit.size>s.pierce)s.life=0;
    },s.owner);
    if(boom){
      sfx('boom');S.fx.push({k:'ring',x:s.x,y:s.y,r:s.aoe,t:0,max:.3,col:s.kind==='popcorn'?'#fff0b0':'#ffb060'});spark(s.x,s.y,10,'#ffd080',200,.4,3,300,true);
      eachTarget(t=>{const rr=rectOf(t);if(Math.hypot(rr.x+rr.w/2-s.x,rr.y+rr.h/2-s.y)<s.aoe+rr.w/2)dealDamage(s.owner,t,s.dmg,sgn(rr.x-s.x))},s.owner);
      s.life=0;
    }
    if(s.x<-60||s.x>L.w+60||s.y>L.h+300||s.y<-700)s.life=0;
  }
  S.pshots=S.pshots.filter(s=>s.life>0);
}

/* ---------- AI companion ---------- */
function pvpAI(p,dt){
  const I={l:0,r:0,u:0,d:0,uT:0,jT:0,jH:0,a:0,aT:0,s:[0,0,0,0,0],fd:0};p.ai=I;
  if(S.pvp.over)return;
  let en=null,ed=9999;for(const q of PARTY){if(q.dead||q.team===p.team)continue;const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<ed){ed=d;en=q}}
  if(!en)return;
  p.aiT-=dt;p.jT=(p.jT||0)-dt;
  const j=JOB[p.job],ranged=j.basic.k==='shoot',dx=en.x-p.x,pref=ranged?260:60;
  I.fd=sgn(dx);
  let go=0;if(Math.abs(dx)>pref+20)go=sgn(dx);else if(ranged&&Math.abs(dx)<pref-90)go=-sgn(dx);
  // 낭떠러지 회피
  if(go&&p.onGround&&!groundAt(S.L,p.x+go*34,p.y-4,120))go=0;
  // 밀려나 섬 밖에 나갔으면 섬 중앙 쪽으로
  const sp=S.L.spawns[p.team];if(p.y>S.L.h-40||(!p.onGround&&Math.abs(p.x-S.L.w/2)>S.L.w/2-60))go=sgn(S.L.w/2-p.x);
  I.l=go<0?1:0;I.r=go>0?1:0;
  if(Math.abs(dx)<(ranged?520:j.basic.range+24)&&Math.abs(en.y-p.y)<120)I.a=1;
  if(en.y<p.y-70&&p.onGround&&p.jT<=0&&Math.abs(dx)<220){I.jT=1;I.jH=1;p.jT=.9}
  if(!p.onGround&&p.y>S.L.h-20&&p.jT<=0){I.jT=1;I.jH=1;p.jT=.5}
  if(p.aiT<=0){p.aiT=.35;for(let i=4;i>=0;i--){
    if(!unlocked(p,i)||p.cds[i]>0||p.mp<j.sk[i].mp+4)continue;const sk=j.sk[i];let use=false;
    if(sk.k==='burst')use=ed<sk.r*.8;else if(sk.k==='fan'||sk.k==='rain'||sk.k==='quake')use=ed<460;else if(sk.k==='dash')use=ed>90&&ed<300;
    else if(sk.k==='buff')use=!p.buff&&ed<420;else if(sk.k==='shield')use=p.hp<p.maxhp*.5;else if(sk.k==='heal')use=p.hp<p.maxhp*.5;
    if(use&&Math.random()<.5){I.s[i]=1;break}}}
}
function aiThink(p,dt){
  if(S.L.pvp)return pvpAI(p,dt);
  const I={l:0,r:0,u:0,d:0,uT:0,jT:0,jH:0,a:0,aT:0,s:[0,0,0,0,0],fd:0};p.ai=I;
  const humans=PARTY.filter(q=>!q.dead&&q.kind!=='ai'),lead=humans[0]||PARTY.find(q=>!q.dead&&q!==p);
  if(!lead)return;
  p.aiT-=dt;
  // find target
  let tg=null,td=p.hold?220:340;
  eachTarget(t=>{if(t.kind==='dummy')return;const r=rectOf(t),d=Math.hypot(r.x+r.w/2-p.x,r.y+r.h/2-(p.y-20));if(d<td){td=d;tg=r}},p);
  const j=JOB[p.job],ranged=j.basic.k==='shoot';
  if(p.hold){
    if(tg){I.fd=sgn(tg.x+tg.w/2-p.x);if(td<(ranged?300:90)){I.a=1}}
  }else{
    const dxL=lead.x-p.x,dyL=lead.y-p.y;
    p.far=(Math.abs(dxL)>620||Math.abs(dyL)>240)?p.far+dt:0;
    if(p.far>1.2||Math.abs(dxL)>900){p.x=lead.x-lead.face*50;p.y=lead.y;p.vx=p.vy=0;p.far=0;p.rope=null;spark(p.x,p.y-20,12,'#cfe0ff',180,.5,3,0,true)}
    let goX=lead.x-p.x,keep=110+(p.slot||0)*50;
    if(tg){
      const tx=tg.x+tg.w/2,pref=ranged?230:58;
      if(Math.abs(tx-p.x)>pref+14)goX=tx-p.x;else if(ranged&&Math.abs(tx-p.x)<pref-60)goX=p.x-tx;else goX=0;
      I.fd=sgn(tx-p.x);
      if(td<(ranged?380:j.basic.range+26)&&Math.abs((tg.y+tg.h/2)-(p.y-20))<110+(ranged?70:0))I.a=1;
      // skills
      if(p.aiT<=0){
        p.aiT=.25;
        for(let i=4;i>=0;i--){
          if(!unlocked(p,i)||p.cds[i]>0||p.mp<j.sk[i].mp+4)continue;const sk=j.sk[i];
          let use=false;
          if(sk.k==='burst')use=td<sk.r*.85;
          else if(sk.k==='fan'||sk.k==='rain'||sk.k==='quake')use=td<420&&(sk.mp>8||Math.random()<.4);
          else if(sk.k==='dash')use=td>100&&td<300;
          else if(sk.k==='buff')use=!p.buff&&td<400;
          else if(sk.k==='shield')use=p.hp<p.maxhp*.55;
          else if(sk.k==='heal')use=PARTY.some(q=>!q.dead&&q.hp<q.maxhp*.55);
          if(use&&Math.random()<.6){I.s[i]=1;break}
        }
      }
    }else{
      if(Math.abs(goX)<keep)goX=0;
      // heal when idle
      if(p.aiT<=0){p.aiT=.4;const sk=j.sk[0];if(j.sk.some((s,i)=>s.k==='heal'&&unlocked(p,i)&&p.cds[i]<=0&&p.mp>=s.mp)&&PARTY.some(q=>!q.dead&&q.hp<q.maxhp*.5)){const i=j.sk.findIndex((s,i)=>s.k==='heal'&&unlocked(p,i));if(i>=0)I.s[i]=1}}
    }
    I.l=goX<-8?1:0;I.r=goX>8?1:0;
    // jump over obstacles / up to leader
    p.jT=(p.jT||0)-dt;
    if(p.onGround&&p.jT<=0){
      if((p.hitWall&&(I.l||I.r))||(lead.y<p.y-70&&Math.abs(dxL)<150&&!tg)||(tg&&tg.y+tg.h/2<p.y-70&&Math.abs(tg.x+tg.w/2-p.x)<110)){I.jT=1;I.jH=1;p.jT=.9}
    }
    if(!p.onGround&&p.vy<0)I.jH=1;
  }
}

function addZone(o){const z=Object.assign({t:0,warn:.8,act:.2,dmg:20,hit:new Set(),kind:'slam',fired:false},o);z.dmg*=(S.L.dmul||1);S.zones.push(z)}
function addEproj(o){const e=Object.assign({x:0,y:0,vx:0,vy:0,r:11,dmg:16,life:5,kind:'fire',grav:0,t:0},o);e.dmg*=(S.L.dmul||1);S.eproj.push(e)}
function tp(){const a=alive();return a[Math.random()*a.length|0]||PARTY[0]}
function updateZones(dt){
  for(const z of S.zones){
    z.t+=dt;
    if(z.t>=z.warn&&!z.fired){z.fired=true;
      if(z.kind==='pillar'||z.kind==='moon')sfx('beam');else if(z.kind==='slam'||z.kind==='band'||z.kind==='claw'){sfx('boom');if(z.kind!=='claw')S.shake=Math.max(S.shake,z.kind==='band'?6:10)}
      if(z.kind==='slam')dust(z.x+z.w/2,z.y+z.h,10);
    }
    if(z.t>=z.warn&&z.t<z.warn+z.act&&z.dmg>0){
      for(const p of PARTY)if(!z.hit.has(p)&&ov(prect(p),z)){z.hit.add(p);hurtPlayer(p,z.dmg,z.x+z.w/2)}
    }
  }
  S.zones=S.zones.filter(z=>z.t<z.warn+z.act+.2);
}
function drawZone(g,z,t){
  const x=z.x,y=z.y,w=z.w,h=z.h;
  if(z.t<z.warn){
    const p=z.t/z.warn,pul=.55+.25*Math.sin(t*22);
    const col=z.kind==='moon'?'120,160,255':z.kind==='warnline'?'255,200,60':'255,50,50';
    g.fillStyle=`rgba(${col},${.10+.12*p})`;g.fillRect(x,y,w,h);
    g.fillStyle=`rgba(${col},${.28*pul})`;
    if(z.kind==='pillar'||z.kind==='moon')g.fillRect(x,y+h*(1-p),w,h*p);else g.fillRect(x,y,w*(z.kind==='warnline'?1:1),h*p>0?h:0);
    g.strokeStyle=`rgba(${col},.85)`;g.lineWidth=2;g.setLineDash([10,7]);g.strokeRect(x+1,y+1,w-2,h-2);g.setLineDash([]);
    if(z.kind==='warnline'){g.fillStyle=`rgba(${col},.9)`;g.font='bold 22px sans-serif';g.textAlign='center';const dir=z.dir||1;for(let i=0;i<w;i+=70)g.fillText(dir>0?'▶':'◀',x+i+35,y+h*.6)}
    else if(z.kind==='band'||z.kind==='claw'){g.fillStyle=`rgba(${col},.9)`;g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('!',x+w/2,y+h/2+6)}
  }else if(z.t<z.warn+z.act){
    const a=1-(z.t-z.warn)/z.act;
    if(z.kind==='pillar'){const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'rgba(255,90,30,0)');gr.addColorStop(.5,`rgba(255,${200+55*a|0},120,${.95})`);gr.addColorStop(1,'rgba(255,90,30,0)');g.fillStyle=gr;g.fillRect(x-10,y,w+20,h)}
    else if(z.kind==='moon'){const gr=g.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'rgba(120,160,255,0)');gr.addColorStop(.5,'rgba(240,250,255,.98)');gr.addColorStop(1,'rgba(120,160,255,0)');g.fillStyle=gr;g.fillRect(x-14,y,w+28,h)}
    else if(z.kind==='slam'){g.fillStyle=`rgba(255,230,180,${.65*a})`;g.fillRect(x,y,w,h);for(let i=0;i<5;i++){poly(g,[x+i*w/5,y+h,x+(i+.5)*w/5,y+h*(.2+hash(i+x)*.4),x+(i+1)*w/5,y+h],`rgba(255,240,200,${.8*a})`)}}
    else if(z.kind==='band'){const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,`rgba(255,200,240,${.9*a})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(x,y,w,h)}
    else if(z.kind==='claw'){g.save();g.strokeStyle=`rgba(255,255,255,${a})`;g.lineWidth=7;g.lineCap='round';for(let i=0;i<3;i++){g.beginPath();g.moveTo(x+(z.dir>0?0:w)+(z.dir>0?20:-20)*i*0,y+8+i*h/3);g.lineTo(x+(z.dir>0?w:0),y+h*.2+i*h/3+16);g.stroke()}g.restore()}
  }
}
function updateEproj(dt){
  const L=S.L;
  for(const e of S.eproj){
    e.t+=dt;e.life-=dt;e.vy+=e.grav*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;
    if(e.kind==='shock'){const g=groundAt(L,e.x,e.y-30,80);if(g)e.y=g.y;if(e.x<16||e.x>L.w-16)e.life=0;if(Math.random()<.6)dust(e.x,e.y,1)}
    if(e.kind==='rock'||e.kind==='shard'){
      for(const pl of L.plats){if(pl.solidOff)continue;if(e.x>pl.x&&e.x<pl.x+pl.w&&e.y>=pl.y&&e.y-e.vy*dt<=pl.y+6&&e.vy>0){e.life=0;dust(e.x,pl.y,6);spark(e.x,pl.y,6,'#b8a890',180,.4,3,400);break}}
    }
    const r=e.kind==='shock'?{x:e.x-24,y:e.y-44,w:48,h:44}:{x:e.x-e.r*.75,y:e.y-e.r*.75,w:e.r*1.5,h:e.r*1.5};
    for(const p of PARTY)if(!p.dead&&ov(prect(p),r)){if(hurtPlayer(p,e.dmg,e.x)&&e.kind!=='shock')e.life=0}
    if(e.x<-80||e.x>L.w+80||e.y>L.h+120||e.y<-300)e.life=0;
  }
  S.eproj=S.eproj.filter(e=>e.life>0);
}
function drawEproj(g,e,t){
  g.save();g.translate(e.x,e.y);
  if(e.kind==='fire'){
    const gl=g.createRadialGradient(0,0,2,0,0,e.r*2.2);gl.addColorStop(0,e.col||'rgba(120,200,255,.95)');gl.addColorStop(1,'rgba(80,140,255,0)');g.fillStyle=gl;g.fillRect(-e.r*2.4,-e.r*2.4,e.r*4.8,e.r*4.8);
    g.rotate(Math.atan2(e.vy,e.vx));g.beginPath();g.moveTo(-e.r*1.8,0);g.quadraticCurveTo(-e.r*.4,-e.r*.95,e.r*.9,0);g.quadraticCurveTo(-e.r*.4,e.r*.95,-e.r*1.8,0);g.fillStyle=e.core||'#bfe8ff';g.fill();circ(g,e.r*.1,0,e.r*.55,'#fff');

  }else if(e.kind==='shock'){
    g.beginPath();g.moveTo(-30*sgn(e.vx),0);g.quadraticCurveTo(-4*sgn(e.vx),-70,24*sgn(e.vx),-6);g.lineTo(24*sgn(e.vx),0);g.closePath();
    const gr=g.createLinearGradient(-30,0,24,0);gr.addColorStop(0,'rgba(255,120,60,.2)');gr.addColorStop(1,'rgba(255,230,160,.95)');g.fillStyle=gr;g.fill();g.strokeStyle='#ffe9b0';g.lineWidth=2;g.stroke();
  }else if(e.kind==='rock'||e.kind==='shard'){
    g.rotate(e.t*(e.kind==='shard'?9:4));
    if(e.kind==='shard'){poly(g,[-9,0,0,-12,9,2,2,12],'#f4ead0',O_,2)}
    else poly(g,[-12,-4,-4,-13,10,-8,13,5,2,13,-10,9],'#8a8394',O_,2.2);
  }
  g.restore();
  if(e.kind==='rock'&&e.shadowY){ell(g,e.x,e.shadowY,14,4,'rgba(0,0,0,.35)')}
}

/* ---------------- boss factory ---------------- */
const BOSS_REW={
  dokkaebi:{pct:.30,coin:500,pool:['hat_helm','face_mask','out_dobok']},
  fox:{pct:.35,coin:1000,pool:['hat_fox','cape_gold','aura_thunder']},
  guimok:{pct:.5,coin:3000,pool:['cape_ghost','aura_flame']},
  eggking:{pct:.40,coin:1500,pool:['hat_crown','out_gold','aura_flame','cape_ghost']},
};
function mkBoss(id){
  if(STORY_BOSS[id])return mkStoryBoss(id,STORY_BOSS[id]);
  const n=PARTY.length,sc=1+.45*(n-1),L=S.L;
  const b={kind:'boss',id,face:-1,phase:1,flash:0,stun:0,anim:'idle',wait:1,cond:null,invuln:false,dying:false,dead:false,vx:0,vy:0,airT:0,onGround:true,gy:470,t:0,alpha:1,alphaT:1,last:''};
  if(id==='dokkaebi'){Object.assign(b,{name:'도깨비 대왕',x:1020,y:470,w:104,h:165,hp:Math.round(2600*sc),spd:125,cdmg:18});b.rect=e=>({x:e.x-44,y:e.y-e.h,w:88,h:e.h});b.gen=dokkaebiBrain(b)}
  else if(id==='fox'){Object.assign(b,{name:'구미호',x:900,y:330,w:80,h:120,hp:Math.round(3800*sc),cdmg:20,tx:900,ty:330,orbs:0,face:-1});b.rect=e=>({x:e.x-34,y:e.y-122,w:68,h:118});b.gen=foxBrain(b)}
  else if(id==='guimok'){Object.assign(b,{name:'천년 귀목',x:L.w/2+20,y:470,w:180,h:300,hp:Math.round(9000*sc),cdmg:24});b.rect=e=>({x:e.x-70,y:e.y-290,w:140,h:290});b.gen=guimokBrain(b);
    for(let i=0;i<8;i++){const side=i%2?1:-1,lv=i>>1,ax=b.x+side*(175+(lv%2)*30),ay=420-lv*65;
      spawnMob('arm',ax,ay,{bx:ax,by:ay,side,lv,hp:Math.round(900*sc),max:Math.round(900*sc),rect:e=>({x:e.x-e.w/2,y:e.y-e.h/2,w:e.w,h:e.h})})}}
  else{Object.assign(b,{name:'킹 달걀 슬라임',x:1000,y:470,w:150,h:190,hp:Math.round(3600*sc),spd:100,cdmg:16});b.rect=e=>({x:e.x-e.w*.46,y:e.y-(e.anim==='roll'?105:e.h),w:e.w*.92,h:e.anim==='roll'?105:e.h-4});b.gen=eggKingBrain(b)}
  if((id==='dokkaebi'&&qst('j2').s==='active')||(id==='fox'&&qst('j3').s==='active')){b.hp=Math.round(b.hp*1.6);b.trial=true;b.name+=' (시련)'}
  b.max=b.hp;return b;
}
function hitBoss(b,dmg,crit,p){
  if(b.invuln||b.dying){const r=rectOf(b);ftext(r.x+r.w/2,r.y,b.id==='guimok'&&!b.dying?'팔부터 부숴라!':'무적','#aab',14);return}
  dmg=Math.round(dmg*(b.stun>0?1.35:1));b.hp-=dmg;b.flash=.09;
  const r=rectOf(b),cx=r.x+r.w/2,cy=r.y+r.h*(.3+Math.random()*.4);
  ftext(cx+rnd(-20,20),r.y+10,dmg,crit?'#ffb040':(b.stun>0?'#ff9aff':'#fff'),crit?28:20);sfx(crit?'crit':'hit');spark(cx,cy,crit?12:6,crit?'#ffb040':'#fff6c0',crit?280:180,.4);
  S.hitstop=Math.max(S.hitstop,crit?.07:.035);
  if(b.hp<=0){b.hp=0;bossDie(b)}
}
function bossDie(b){
  b.dying=true;b.dieT=0;b.gen=null;b.cond=null;b.vx=0;b.anim='stun';S.zones=[];S.eproj=[];S.clones=[];
  for(const m of S.mobs)if(!m.dead){m.dead=true;spark(m.x,m.y,10,'#fff',200,.5)}
  sfx('roar');S.shake=24;S.slow=1.6;G.toast(b.name+' 격파!');
}
function bossFinish(b){
  b.dead=true;const bid=b.sid||b.id,rw=BOSS_REW[bid];
  SAVE.cleared[bid]=true;rw.exp=Math.max(30,Math.round(need(SAVE.lvl)*rw.pct*bossPct(SAVE.lvl)));gainExp(rw.exp);addCoins(rw.coin);
  let drop=null;const free=rw.pool.filter(i=>!SAVE.inv[i]);
  if(free.length&&Math.random()<(b.id==='guimok'?.3:1)){drop=free[Math.random()*free.length|0];SAVE.inv[drop]=1}
  const extra=[];
  for(const[gid,rate]of(GEAR_DROP[bid]||[]))if(Math.random()<rate*EV().drop){const d=GEAR[gid];if(SAVE.ginv[gid]){const c=[50,150,400,1200,3000][d.gr];SAVE.coins+=c;extra.push('['+GRADE[d.gr]+'] '+d.n+' (중복 → '+c+'●)')}else{SAVE.ginv[gid]=1;extra.push('★ ['+GRADE[d.gr]+'] '+d.n+' 획득!')}}
  if(bid==='guimok'&&Math.random()<.4*EV().drop){SAVE.inv.essence=(SAVE.inv.essence||0)+1;extra.push('귀목의 정수 +1');qev('collect',{item:'essence'})}
  qev('boss',{id:bid});
  if(bid==='eggking'){SAVE.pq=(SAVE.pq||0)+1;qev('pq',{})}
  saveGame();
  G.clear={title:b.name+' 격파!',lines:['경험치 +'+rw.exp,'야채코인 +'+rw.coin].concat(drop?['획득: '+ITEMS[drop].n+' ['+RARITY[ITEMS[drop].r]+']']:[]).concat(extra).slice(0,5)};
  G.state='clear';
  if(b.sid)steleCheck(STORY_BOSS[b.sid].c);
}
function updateBoss(dt){
  const b=S.boss;if(!b||b.dead)return;
  b.flash-=dt;b.t+=dt;const L=S.L;
  b.alpha=approach(b.alpha,b.alphaT,dt*5);
  if(b.dying){
    b.dieT+=dt;if(Math.random()<.7)spark(b.x+rnd(-50,50),b.y-rnd(10,150),3,'#ffd34a',220,.5,4,100,true);
    if(b.dieT>1.2&&!b.boomed){b.boomed=true;spark(b.x,b.y-80,60,'#fff7c0',500,.9,5,200,true);sfx('boom');S.shake=30}
    if(b.dieT>2.6)bossFinish(b);
    return;
  }
  if(b.stun>0)b.stun-=dt;
  if(b.id==='guimok'){const any=S.mobs.some(m=>m.type==='arm'&&!m.dead);b.invuln=any||b.lock;if(!any&&b.phase===1){b.phase=2;sfx('roar');S.shake=20;spark(b.x,b.y-150,50,'#ff6a20',420,.8,5,0,true)}}
  // script
  if(b.cond){if(b.cond())b.cond=null}else if(b.wait>0)b.wait-=dt;
  if(!b.cond&&b.wait<=0&&b.gen){
    for(let g=0;g<4;g++){const r=b.gen.next(),v=r.value;if(typeof v==='function'){b.cond=v;break}b.wait=v||0;if(b.wait>0)break}
  }
  // physics
  if(b.id==='fox'){
    b.x+=(b.tx-b.x)*Math.min(1,dt*2.4);b.y+=(b.ty-b.y)*Math.min(1,dt*2.4);b.bob=Math.sin(b.t*2)*5;
    if(b.orbs){b.orbA=(b.orbA||0)+dt*2.3;b.orbPos=[];for(let i=0;i<b.orbs;i++){const a=b.orbA+i*6.283/b.orbs;b.orbPos.push({x:b.x+Math.cos(a)*100,y:b.y-60+Math.sin(a)*70})}
      for(const o of b.orbPos)for(const p of PARTY)if(!p.dead&&Math.hypot(p.x-o.x,p.y-30-o.y)<30)hurtPlayer(p,14,o.x)}
  }else{
    b.hitWall=false;b.x+=b.vx*dt;
    if(b.x<90){b.x=90;if(b.vx<0)b.hitWall=true}if(b.x>L.w-90){b.x=L.w-90;if(b.vx>0)b.hitWall=true}
    b.vy+=GRAV*dt;b.y+=b.vy*dt;b.airT=b.onGround?0:b.airT+dt;
    if(b.y>=b.gy){const was=b.onGround;b.y=b.gy;if(b.vy>0)b.vy=0;b.onGround=true;if(!was)b.justLanded=true}else b.onGround=false;
    if(b.anim==='roll')b.rot=(b.rot||0)+b.vx*dt/80;
  }
  // contact
  const r=rectOf(b),cd=b.cdmg*(b.anim==='charge'||b.anim==='roll'?1.5:1);
  if(b.anim!=='vanish'&&b.alpha>.6)for(const p of PARTY)if(!p.dead&&ov(prect(p),{x:r.x+8,y:r.y+8,w:r.w-16,h:r.h-12}))hurtPlayer(p,cd*(b.sid?1:(S.L.dmul||1)),b.x,{kb:300});
  // clones
  for(const c of S.clones){c.t+=dt;
    if(c.t>.9&&!c.fired){c.fired=true;const t=nearestAlive(c.x,c.y)||PARTY[0],ang=Math.atan2(t.y-40-c.y,t.x-c.x),n=b.phase>1?7:5;sfx('fire');for(let i=0;i<n;i++){const a=ang+(i-(n-1)/2)*.2;addEproj({x:c.x,y:c.y-60,vx:Math.cos(a)*320,vy:Math.sin(a)*320,r:10,dmg:14})}}
    if(c.t>1.6){c.dead=true;spark(c.x,c.y-60,16,'#9fd0ff',200,.5,3,0,true)}
  }
  S.clones=S.clones.filter(c=>!c.dead);
}
function drawBoss(g,b,t){
  if(b.dead)return;
  drawCreepBack(g,b,t);
  g.save();g.filter=(b.hue?'hue-rotate('+b.hue+'deg) ':'')+'saturate(.85) contrast(1.15)';
  if(b.id==='guimok')drawGuimok(g,b,t);
  else if(b.id==='dokkaebi')drawDokkaebi(g,b,t);

    drawFox(g,Object.assign({},b,{y:b.y+(b.bob||0)}),t,b.alpha);
    if(b.orbPos)for(const o of b.orbPos){const gl=g.createRadialGradient(o.x,o.y,2,o.x,o.y,26);gl.addColorStop(0,'rgba(255,160,230,.95)');gl.addColorStop(1,'rgba(255,100,200,0)');g.fillStyle=gl;g.fillRect(o.x-28,o.y-28,56,56);circ(g,o.x,o.y,7,'#fff0fa')}
  }else drawEggKing(g,b,t);
  if(b.stun>0){g.fillStyle='#ffe04a';g.font='bold 22px sans-serif';g.textAlign='center';for(let i=0;i<3;i++){const a=t*5+i*2.1;g.fillText('★',b.x+Math.cos(a)*40,b.y-b.h-8+Math.sin(a)*8)}}
  g.restore();
  drawCreepFront(g,b,t);
}

/* ---------------- 도깨비 대왕 ---------------- */
function* walkTo(b,dist,maxT){let t=0;while(Math.abs(b.tg.x-b.x)>dist&&t<maxT){b.face=sgn(b.tg.x-b.x);b.vx=b.face*b.spd*(b.phase>1?1.3:1);b.anim='walk';t+=.05;yield .05}b.vx=0;b.anim='idle'}
function* dokkaebiBrain(b){
  while(true){
    if(b.hp<=b.max*.5&&b.phase===1)yield* dkPhase(b);
    yield b.phase>1?.5:.9;
    const opts=['slam','leap','rain','charge'];let pick;do{pick=opts[Math.random()*4|0]}while(pick===b.last);b.last=pick;
    b.tg=tp();
    if(pick==='slam')yield* dkSlam(b);else if(pick==='leap')yield* dkLeap(b);else if(pick==='rain')yield* dkRain(b);else yield* dkCharge(b);
  }
}
function* dkPhase(b){
  b.phase=2;b.invuln=true;b.vx=0;b.anim='roar';sfx('roar');S.shake=18;G.toast('도깨비 대왕이 분노했다!');
  for(let i=0;i<3;i++)spawnMob('wisp',250+i*300,300,{chase:true,range:30,bonus:true});
  spark(b.x,b.y-100,40,'#ff4a30',420,.8,5,0,true);yield 1.6;b.invuln=false;b.anim='idle';
}
function* dkSlam(b){
  yield* walkTo(b,190,1.7);b.face=sgn(b.tg.x-b.x);b.anim='raise';
  addZone({x:b.face>0?b.x+10:b.x-250,y:b.gy-95,w:240,h:95,warn:.8,act:.14,dmg:26,kind:'slam'});sfx('warn');yield .8;
  b.anim='slam';S.shake=14;
  for(const d of(b.phase>1?[1,-1]:[b.face]))addEproj({kind:'shock',x:b.x+d*120,y:b.gy,vx:d*(b.phase>1?440:350),dmg:20,life:5,r:20});
  yield .7;b.anim='idle';
  if(b.phase>1){b.anim='raise';addZone({x:b.face>0?b.x+10:b.x-250,y:b.gy-95,w:240,h:95,warn:.55,act:.14,dmg:26,kind:'slam'});yield .55;b.anim='slam';S.shake=12;yield .5;b.anim='idle'}
}
function* dkLeap(b){
  const L=S.L,tx=clamp(b.tg.x,170,L.w-170);

    const xs=[210,640,1070];b.tx=xs[Math.random()*3|0];b.ty=300+rnd(-20,30);b.face=sgn(b.tg.x-b.tx);yield .8;

const FONT='"Jua","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Nanum Gothic",sans-serif';
const F=(s,w='normal')=>`${w} ${Math.round(s*.86*10)/10}px ${FONT}`;
function txt(g,s,x,y,size=16,col='#fff',al='left',o=3){

function panel(g,x,y,w,h,a=.82){
  g.save();g.beginPath();g.roundRect(x,y,w,h,16);const bg=g.createLinearGradient(0,y,0,y+h);bg.addColorStop(0,`rgba(74,52,140,${a})`);bg.addColorStop(1,`rgba(46,30,96,${a})`);g.fillStyle=bg;g.fill();
  const st=g.createLinearGradient(x,0,x+w,0);st.addColorStop(0,'rgba(255,190,235,.9)');st.addColorStop(.5,'rgba(200,220,255,.9)');st.addColorStop(1,'rgba(255,230,180,.9)');g.lineWidth=2.5;g.strokeStyle=st;g.stroke();

}
function wrap(g,s,maxW,size){
  g.font=F(size);const out=[];
  for(const para of String(s).split('\n')){
    let line='';
    for(const ch of para){const t=line+ch;if(g.measureText(t).width>maxW&&line){out.push(line);line=ch.trimStart()}else line=t}
    out.push(line);
  }
  return out;
}
function bar(g,x,y,w,h,v,col,bg='rgba(0,0,0,.6)'){

  if(v>0){g.fillStyle=col;g.beginPath();g.roundRect(x+1.5,y+1.5,Math.max(h-3,(w-3)*clamp(v,0,1)),h-3,(h-3)/2);g.fill();g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.roundRect(x+1.5,y+1.5,Math.max(h-3,(w-3)*clamp(v,0,1)),(h-3)/2,(h-3)/2);g.fill()}

}

/* ---------------- quest logic ---------------- */
function qst(id){return SAVE.q[id]||(SAVE.q[id]={s:'none',p:[]})}
function qAvail(id){const q=QUESTS[id],st=qst(id);return st.s==='none'&&SAVE.lvl>=q.min&&(q.pre||[]).every(r=>qst(r).s==='done')&&(!q.story||q.story===1||steleOpen(q.story-1))}
function qAccept(id){
  const q=QUESTS[id],st=qst(id);st.s='active';
  st.p=q.objs.map(o=>o.t==='collect'?Math.min(o.n,SAVE.inv[o.item]||0):o.t==='lvl'?(SAVE.lvl>=o.n?o.n:0):o.t==='talk'?Math.min(o.n,Object.keys(SAVE.talked).length):0);
  qcheck(id);G.toast('퀘스트 수락: '+q.name);sfx('sel');saveGame();
}
function qcheck(id){
  const q=QUESTS[id],st=qst(id);if(st.s!=='active')return;
  if(q.objs.every((o,i)=>st.p[i]>=(o.n||1))){st.s='ready';G.toast('퀘스트 완료! ['+q.name+'] — '+GIVER_NAME[q.giver]+'에게 보고하세요');sfx('flag')}
}
function qev(type,d){
  if(!SAVE)return;
  if(type==='flag'&&!d)return;
  for(const id in SAVE.q){
    const st=SAVE.q[id];if(st.s!=='active')continue;const q=QUESTS[id];let ch=false;
    q.objs.forEach((o,i)=>{
      const nn=o.n||1;if(st.p[i]>=nn)return;let v=st.p[i];
      if(type==='kill'&&o.t==='kill'&&(o.mob==='any'?d.mob!=='dummy':o.mob===d.mob)&&(!o.map||(S&&S.id.startsWith(o.map))))v++;
      else if(type==='dg'&&o.t==='dg'&&o.ch===d.ch)v++;
      else if(type==='boss'&&o.t==='boss'&&o.id===d.id)v=o.n>1?v+1:nn;
      else if(type==='flag'&&o.t==='flag'&&o.key===d)v=1;
      else if(type==='reach'&&o.t==='reach'&&o.map===d.map)v=1;
      else if(type==='collect'&&o.t==='collect'&&o.item===d.item)v++;
      else if(type==='count'&&o.t==='count'&&o.key===d.key)v+=d.n||1;
      else if(type==='talk'&&o.t==='talk')v=Math.min(nn,Object.keys(SAVE.talked).length);
      else if(type==='lvl'&&o.t==='lvl')v=SAVE.lvl>=o.n?nn:0;
      else if(type==='pq'&&o.t==='pq')v++;
      v=Math.min(v,nn);if(v!==st.p[i]){st.p[i]=v;ch=true}
    });
    if(ch)qcheck(id);
  }
}
function qExp(q){
  const r=q.rew;if(r.pct==='d')return Math.max(5,Math.round(need(SAVE.lvl)*dailyPct(SAVE.lvl)));
  if(r.pct)return Math.round(need(SAVE.lvl)*r.pct);return r.exp||0;
}
function qCoin(q){return q.daily?100+SAVE.lvl*10:(q.rew.coin||0)}
function qTurnIn(id){
  const q=QUESTS[id],st=qst(id);if(st.s!=='ready')return;
  for(const o of q.objs)if(o.t==='collect')SAVE.inv[o.item]=Math.max(0,(SAVE.inv[o.item]||0)-o.n);
  st.s='done';const lines=[];
  const ex=qExp(q),cn=qCoin(q);
  if(ex){gainExp(ex);lines.push('경험치 +'+ex)}
  if(cn){SAVE.coins+=cn;lines.push('야채코인 +'+cn)}
  if(q.rew.item){if(!SAVE.inv[q.rew.item]){SAVE.inv[q.rew.item]=1;lines.push('획득: '+ITEMS[q.rew.item].n+' ['+RARITY[ITEMS[q.rew.item].r]+']')}else{SAVE.coins+=ITEMS[q.rew.item].price/2|0;lines.push('중복 아이템 → '+(ITEMS[q.rew.item].price/2|0)+' 코인')}}
  if(q.rew.give)for(const k in q.rew.give){SAVE.inv[k]=(SAVE.inv[k]||0)+q.rew.give[k];lines.push('획득: '+ETC_NAME[k]+' ×'+q.rew.give[k])}
  if(q.rew.gear){const g=GEAR[q.rew.gear];if(!SAVE.ginv[q.rew.gear]){SAVE.ginv[q.rew.gear]=1;lines.push('★ 획득: ['+GRADE[g.gr]+'] '+g.n+'  (인벤토리 I → 장비)')}else{SAVE.coins+=1000;lines.push('중복 장비 → 1000 코인')}}
  if(q.rep){st.s='none';st.p=[]}
  if(q.adv){advanceJob(q.adv);lines.push('전직 완료!  '+jline(JOB[SAVE.job],q.adv))}
  sfx('lvl');saveGame();return lines;
}
function advanceJob(t){
  SAVE.tier=t;const p=PARTY[0];p.tier=t;recalc(p);p.hp=p.maxhp;p.mp=p.maxmp;
  spark(p.x,p.y-40,60,'#ffe04a',420,1,5,0,true);S.fx.push({k:'ring',x:p.x,y:p.y-40,r:260,t:0,max:1,col:'#ffe04a'});S.shake=14;
  G.toast(jline(JOB[SAVE.job],t)+'(으)로 전직했다!  새 스킬 해금');
}
function npcMark(id){
  let rd=false,nw=false,ac=false;
  for(const k in QUESTS){if(QUESTS[k].giver!==id)continue;const s=qst(k).s;if(s==='ready')rd=true;else if(s==='none'&&qAvail(k))nw=true;else if(s==='active')ac=true}
  return rd?'ready':nw?'new':ac?'act':null;
}

function questMenu(n,giver,intro){
  const ids=Object.keys(QUESTS).filter(k=>QUESTS[k].giver===giver&&(qst(k).s!=='none'||qAvail(k)));
  const opts=ids.map(k=>{const s=qst(k).s;return{t:({none:'[!] ',active:'[진행중] ',ready:'[완료!] ',done:'[끝] '})[s]+QUESTS[k].name,fn:()=>questDetail(n,giver,k)}});
  opts.push({t:'닫기',fn:closeUI});
  openDialog(n.name,intro||'무엇을 도와줄까?',opts);
}
function questDetail(n,giver,id){
  const q=QUESTS[id],st=qst(id);
  let txt_=q.desc+'\n\n';
  q.objs.forEach((o,i)=>{txt_+=(st.s==='none'?'▫ ':(st.p[i]>=(o.n||1)?'✔ ':'▫ '))+o.label+(o.n>1&&st.s!=='none'?'  ('+Math.min(st.p[i],o.n)+'/'+o.n+')':(o.n>1?'  ×'+o.n:''))+'\n'});
  const r=q.rew;txt_+='\n보상: EXP '+qExp(q)+'  코인 '+qCoin(q)+'  '+(r.item?'['+ITEMS[r.item].n+']':'')+(r.gear?'  ['+GRADE[GEAR[r.gear].gr]+'] '+GEAR[r.gear].n+' ('+gearDesc(r.gear)+')':'')+(r.give?'  '+Object.keys(r.give).map(k=>ETC_NAME[k]+'×'+r.give[k]).join(' '):'')+(q.adv?'  ★'+q.adv+'차 전직':'')+(q.rep?'\n(반복 가능)':'');
  const opts=[];
  if(st.s==='none')opts.push({t:'수락한다',fn:()=>{qAccept(id);if(q.sceneA)playScene(q.sceneA,()=>questMenu(n,giver,'부탁하네!'));else questMenu(n,giver,'좋아, 잘 부탁하네!')}});
  if(st.s==='ready')opts.push({t:'완료 보고',fn:()=>{const l=qTurnIn(id);if(q.sceneB){playScene(q.sceneB,()=>openDialog(n.name,'퀘스트 완료!\n\n'+l.join('\n'),[{t:'확인',fn:()=>questMenu(n,giver)}]));return}openDialog(n.name,'수고했네! 퀘스트 완료!\n\n'+l.join('\n'),[{t:'확인',fn:()=>questMenu(n,giver)}])}});
  opts.push({t:'뒤로',fn:()=>questMenu(n,giver)});
  openDialog(n.name+' · '+q.name,txt_,opts);
}

const DAILY_IDS=Object.keys(QUESTS).filter(k=>QUESTS[k].daily);
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function checkDaily(){
  const k=todayKey();if(SAVE.dayKey===k)return false;
  SAVE.dayKey=k;SAVE.dbonus=false;
  for(const id of DAILY_IDS){SAVE.q[id]={s:'none',p:[]};}
  saveGame();return true;
}
function dailyDone(){return DAILY_IDS.every(k=>qst(k).s==='done')}
function dailyMenu(n){
  checkDaily();
  const done=DAILY_IDS.filter(k=>qst(k).s==='done').length;
  const opts=DAILY_IDS.map(k=>({t:({none:'[!] ',active:'[진행중] ',ready:'[완료!] ',done:'[끝] '})[qst(k).s]+QUESTS[k].name.replace('[일일] ',''),fn:()=>questDetail(n,'daily',k)}));
  if(dailyDone()&&!SAVE.dbonus)opts.push({t:'[보너스!] 올클리어 보상 받기',fn:()=>{
    SAVE.dbonus=true;SAVE.ec+=2;const ex=Math.max(10,Math.round(need(SAVE.lvl)*dailyPct(SAVE.lvl)*2)),cn=500+SAVE.lvl*30;gainExp(ex);SAVE.coins+=cn;sfx('lvl');saveGame();
    openDialog(n.name,'오늘의 의뢰를 전부 해냈구나! 대단해!\n\n경험치 +'+ex+'\n야채코인 +'+cn+'\n이벤트 코인 ◆ +2',[{t:'확인',fn:()=>dailyMenu(n)}])}});
  opts.push({t:'닫기',fn:closeUI});

  openDialog(n.name,'매일 새로 붙는 일일 의뢰다. 자정이 지나면 초기화돼!\n의뢰 1개당 경험치 = 현재 레벨 필요량의 '+pc+'%\n올클리어 보너스 = 그 2배 + 이벤트 코인 ◆2\n\n오늘 완료 '+done+' / '+DAILY_IDS.length+(SAVE.dbonus?'  (보너스 수령 완료)':''),opts);

const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
function attMenu(n){
  const a=SAVE.att,dn=dayNum();
  if(a.last>=0&&a.last<dn-1&&a.streak>0&&a.last!==dn)a.streakBroken=true;
  const done=a.last===dn,cur=done?a.streak:(a.last===dn-1?a.streak:0),mark=((cur-1+7)%7)+1;
  const shown=cur===0?0:(cur%7===0?7:cur%7);
  let bar='';for(let i=1;i<=7;i++)bar+=(i<=shown?'■':'□');
  const opts=[];
  if(!done)opts.push({t:'출석 도장 찍기!',fn:()=>checkIn(n)});
  opts.push({t:'이벤트 상점 안내',fn:()=>openDialog(n.name,'이벤트 상점(양배추)은 마을 가운데쯤에 있어. 캐시 치장템은 거기서 ◆ 이벤트 코인으로만 살 수 있어!\n\n◆ 얻는 법\n· 매일 출석 (연속일수 보상)\n· 7일 연속 출석 → 캐시템 지급\n· 누적 출석 10/20/30/50/100일 보너스\n· 일일 퀘스트 올클리어 ◆2 · PvP 승리 ◆1',[{t:'뒤로',fn:()=>attMenu(n)}])});
  opts.push({t:'닫기',fn:closeUI});
  openDialog(n.name,'매일 도장을 찍으면 이벤트 코인(◆)을 줘요! 하루라도 빠지면 연속 출석이 처음부터예요.\n\n연속 출석  '+bar+'  ('+shown+'/7)'+(done?'   — 오늘 출석 완료!':'')+'\n누적 출석 '+a.total+'일 · 보유 ◆ '+SAVE.ec+'\n\n보상: 1·2일 ◆3 / 3·4일 ◆5 / 5·6일 ◆8 / 7일 ◆20 + 캐시 치장템',opts);
}
function checkIn(n){
  const a=SAVE.att,dn=dayNum();if(a.last===dn)return attMenu(n);
  a.streak=(a.last===dn-1)?a.streak+1:1;a.last=dn;a.total++;
  const idx=(a.streak-1)%7,ec=ATT_DAY[idx],lines=['연속 '+a.streak+'일째 출석!','이벤트 코인 ◆ +'+ec];
  SAVE.ec+=ec;
  if(idx===6){
    a.weeks=(a.weeks||0)+1;const free=ATT_WEEK_ITEMS.filter(k=>!SAVE.inv[k]);
    if(free.length){const k=free[0];SAVE.inv[k]=1;lines.push('7일 연속 출석 보상!  획득: '+ITEMS[k].n)}
    else{SAVE.ec+=30;lines.push('7일 연속 출석 보상!  (캐시템을 모두 가졌다) ◆ +30')}
  }
  if(ATT_MILE[a.total]){SAVE.ec+=ATT_MILE[a.total];lines.push('누적 '+a.total+'일 달성 보너스 ◆ +'+ATT_MILE[a.total])}
  sfx('lvl');saveGame();
  openDialog(n.name,'도장 쾅! 오늘도 출석했구나!\n\n'+lines.join('\n'),[{t:'확인',fn:()=>attMenu(n)}]);
}

const enhSlots=()=>7+SAVE.tier;
function enhText(){const e=SAVE.enh;return '근육 강화 +'+e.atk+' (공격력 +'+(e.atk*1.2).toFixed(1)+'%)\n체력 강화 +'+e.hp+' (체력 +'+(e.hp*1.5).toFixed(1)+'%)\n남은 주문서 슬롯 '+(enhSlots()-e.used)+' / '+enhSlots()+'  (전직할 때마다 슬롯 +1)'}
function keepSel(fn,sel){fn();if(G.dlg)G.dlg.sel=Math.min(sel,G.dlg.opts.length-1)}
function scrollMenu(n){
  openDialog(n.name,'쉿… 목소리를 낮추게. 나는 아무한테나 안 파는 보따리 장수라네.\n주문서는 슬롯을 한 칸 쓰고, 성공해야 강화가 된다네. 순백의 주문서로 슬롯을 되살릴 수도 있지.\n\n'+enhText(),[
    {t:'주문서 구매  (● '+SAVE.coins+')',fn:()=>scrollBuy(n)},{t:'주문서 사용',fn:()=>scrollUse(n)},{t:'닫기',fn:closeUI}]);
}
function scrollBuy(n,sel){
  const ks=Object.keys(SCROLLS);
  const opts=ks.map(k=>{const d=SCROLLS[k];return{t:d.n+'  '+d.price+'●  (보유 '+(SAVE.scrolls[k]||0)+')',fn:()=>{
    if(SAVE.coins<d.price){G.toast('코인이 부족합니다');return}
    SAVE.coins-=d.price;SAVE.scrolls[k]=(SAVE.scrolls[k]||0)+1;sfx('pickup');saveGame();keepSel(()=>scrollBuy(n),ks.indexOf(k))}}});
  opts.push({t:'뒤로',fn:()=>scrollMenu(n)});
  openDialog(n.name,'어떤 주문서가 필요한가?\n근육 : 공격력 / 체력 : 최대 체력\n성공 시 강화 수치가 오른다네.\n\n보유 코인 ● '+SAVE.coins+'\n'+enhText(),opts);
  if(sel!==undefined)G.dlg.sel=sel;
}
function scrollUse(n){
  const ks=Object.keys(SCROLLS).filter(k=>SAVE.scrolls[k]>0);
  const opts=ks.map(k=>({t:SCROLLS[k].n+'  ×'+SAVE.scrolls[k],fn:()=>useScroll(n,k)}));
  if(!ks.length)opts.push({t:'(보유한 주문서가 없다)',fn:()=>scrollMenu(n)});
  opts.push({t:'뒤로',fn:()=>scrollMenu(n)});
  openDialog(n.name,'어떤 주문서를 쓰겠나?\n\n'+enhText(),opts);
}
function scrollApply(k){   // 주문서 1장 사용 → {ok,msg} (슬롯 없음 등은 used:false)
  const d=SCROLLS[k],e=SAVE.enh,p=PARTY[0];
  if(!(SAVE.scrolls[k]>0))return{used:false,msg:'주문서가 없다'};
  if(d.apreset){const tot=SAVE.ap.str+SAVE.ap.dex+SAVE.ap.int+SAVE.ap.luk-16+SAVE.apFree;SAVE.ap={str:4,dex:4,int:4,luk:4};SAVE.apFree=tot;SAVE.scrolls[k]--;gearValidate();recalc(p);sfx('lvl');saveGame();return{used:true,ok:true,msg:'능력치가 초기화됐다! AP '+tot+' — O 키로 다시 분배하자'}}
  if(d.white){
    if(e.used<=0)return{used:false,msg:'복구할 슬롯이 없다. 지금 슬롯은 모두 멀쩡해!'};
    SAVE.scrolls[k]--;e.used--;sfx('lvl');spark(p.x,p.y-40,24,'#ffffff',260,.8,4,0,true);saveGame();
    return{used:true,ok:true,msg:'순백의 빛이 퍼진다…\n슬롯 1칸이 복구되었다!'};
  }
  if(e.used>=enhSlots())return{used:false,msg:'남은 슬롯이 없다. 순백의 주문서로 슬롯을 되살리거나 전직하자!'};
  SAVE.scrolls[k]--;e.used++;let msg,ok=Math.random()<d.rate;
  if(ok){e[d.stat]+=d.pts;recalc(p);sfx('lvl');spark(p.x,p.y-40,40,d.stat==='atk'?'#ff9a4a':'#6aff8a',320,.9,4,200,true);S.fx.push({k:'ring',x:p.x,y:p.y-40,r:150,t:0,max:.7,col:'#ffe04a'});
    msg='주문서 성공!!!\n'+(d.stat==='atk'?'근육 강화':'체력 강화')+' +'+d.pts+'  →  +'+e[d.stat]}
  else{sfx('hurt');spark(p.x,p.y-40,16,'#888',180,.6);msg='주문서가 타버렸다… 실패!\n(슬롯만 1칸 소모됨)'}
  saveGame();return{used:true,ok,msg};
}
function useScroll(n,k){
  const r=scrollApply(k);
  if(!r.used){openDialog(n.name,r.msg+'\n\n'+enhText(),[{t:'뒤로',fn:()=>scrollUse(n)}]);return}
  const again=SAVE.scrolls[k]>0;
  openDialog(n.name,r.msg+'\n\n'+enhText(),[again?{t:'같은 주문서 또 사용  (×'+SAVE.scrolls[k]+')',fn:()=>useScroll(n,k)}:{t:'다른 주문서 사용',fn:()=>scrollUse(n)},{t:'뒤로',fn:()=>scrollMenu(n)}]);
}

    opts.push({t:SAVE.lvl>=40?'귀문 동굴 (파티던전)':'귀문 동굴 (Lv.40 이상)',fn:()=>{if(SAVE.lvl<40){openDialog(n.name,'귀문은 Lv.40 이상만 들어갈 수 있다네. 그 너머엔 천년 묵은 귀목이 잠들어 있지…');return}closeUI();goMap('cave')}});
    opts.push({t:'닫기',fn:closeUI});

function mikoMenu(n){
  const opts=[];
  const ids=['hid'].filter(k=>qst(k).s!=='none'||qAvail(k));
  ids.forEach(k=>opts.push({t:({none:'[!] ',active:'[진행중] ',ready:'[완료!] ',done:'[끝] '})[qst(k).s]+QUESTS[k].name,fn:()=>questDetail(n,'miko',k)}));
  if(qst('hid').s==='active'||qst('hid').s==='ready'||qst('hid').s==='done'||SAVE.lvl>=6)opts.push({t:'달걀 슬라임 소굴로 들어간다 (파티 3명 필요)',fn:()=>enterPQ(n)});
  opts.push({t:'닫기',fn:closeUI});
  openDialog(n.name,'……찾아냈구나. 이 마을 구석까지 오는 자는 드문데.\n달걀 슬라임 소굴에 영혼들이 갇혀 있어. 혼자서는 열 수 없는 문… 세 명이 힘을 모아야 해.',opts);
}
function enterPQ(n){
  if(PARTY.length<3){
    openDialog(n.name,'세 명 이상의 파티가 필요해.\nAI 동료로 빈자리를 채워줄까?',[{t:'AI 동료로 채우고 입장',fn:()=>{while(PARTY.length<3)addMember('ai',JOBS[Math.random()*8|0].id);closeUI();startPQ()}},{t:'파티 모집꾼을 찾아간다',fn:closeUI}]);
    return;
  }
  closeUI();startPQ();
}
function partyMenu(n){
  const has2=PARTY.some(p=>p.kind==='p2'),nAI=PARTY.filter(p=>p.kind==='ai').length;
  const opts=[
    {t:has2?'2P 로컬 플레이어 해제':'2P 로컬 플레이어 참가  (WASD · F · G/H/T/Y/U)',fn:()=>{if(has2)removeMember(PARTY.find(p=>p.kind==='p2'));else if(PARTY.length<4)jobPick('2P 직업 선택',id=>{addMember('p2',id);partyMenu(n)});else openDialog(n.name,'파티가 가득 찼어!');if(has2)partyMenu(n)}},

function jobPick(title,fn){
  openDialog(title,'직업을 고르세요.',JOBS.map(j=>({t:j.veg+' · '+j.role,fn:()=>{closeUI();fn(j.id)}})).concat([{t:'취소',fn:closeUI}]));
}
function addMember(kind,jobId){
  const lead=PARTY[0],lv=SAVE.lvl,p=mkPlayer(kind,jobId,lv);
  p.tier=kind==='p1'?SAVE.tier:tierOfLv(lv);recalc(p);p.hp=p.maxhp;p.mp=p.maxmp;
  p.slot=PARTY.length;p.x=lead.x-lead.face*40;p.y=lead.y;p.face=lead.face;
  const pool=Object.keys(ITEMS).filter(k=>!ITEMS[k].cash);if(kind==='ai'||kind==='p2'){for(const s of['hat','face','outfit','cape','aura']){if(Math.random()<(s==='aura'?.25:.5)){const c=pool.filter(k=>ITEMS[k].slot===s);p.eq[s]=c[Math.random()*c.length|0]}}}
  PARTY.push(p);spark(p.x,p.y-30,16,'#cfe0ff',200,.5,3,0,true);sfx('portal');
  G.toast((kind==='ai'?'AI 동료':kind==='p2'?'2P':'')+' '+JOB[jobId].veg+' '+jline(JOB[jobId],p.tier)+' 합류!');
}
function removeMember(p){PARTY.splice(PARTY.indexOf(p),1);PARTY.forEach((q,i)=>q.slot=i)}

/* ---------------- shop ---------------- */
function openShop(cash){G.ui='shop';G.shop={tab:cash?2:0,sel:0,cash:!!cash};sfx('sel')}
function shopList(){
  if(G.shop.cash)return CASH_ITEMS.map(id=>({id,cash:1}));
  return G.shop.tab===0?[{id:'hp',potion:true},{id:'mp',potion:true},{id:'m',mega:1},{id:'h',mega:1}]:SHOP_ITEMS.map(id=>({id}));
}
function shopUpdate(){
  const nv=nav(),lst=shopList();
  if(nv.back){closeUI();return}
  if((nv.l||nv.r)&&!G.shop.cash){G.shop.tab=1-G.shop.tab;G.shop.sel=0;sfx('sel')}
  if(nv.u)G.shop.sel=(G.shop.sel+lst.length-1)%lst.length;
  if(nv.d)G.shop.sel=(G.shop.sel+1)%lst.length;
  if(nv.ok){
    const it=lst[G.shop.sel];
    if(it.mega){const d=MEGA[it.id],ec=d.cur==='◆',have=ec?SAVE.ec:SAVE.coins;if(have>=d.price){if(ec)SAVE.ec-=d.price;else SAVE.coins-=d.price;SAVE.mega[it.id]++;sfx('pickup');G.toast(d.n+' 구매! (Enter 채팅에서 선택)');saveGame()}else G.toast(ec?'이벤트 코인이 부족합니다':'코인이 부족합니다')}
    else if(it.potion){const pr=POTION[it.id].price;if(SAVE.coins>=pr){SAVE.coins-=pr;SAVE.potions[it.id]++;sfx('pickup');G.toast(POTION[it.id].n+' 구매!')}else G.toast('코인이 부족합니다')}
    else if(it.cash){const d=ITEMS[it.id];if(SAVE.inv[it.id])G.toast('이미 가지고 있습니다');else if(SAVE.ec>=d.ec){SAVE.ec-=d.ec;SAVE.inv[it.id]=1;sfx('lvl');G.toast(d.n+' 구매! 옷장(I)에서 착용하세요');saveGame()}else G.toast('이벤트 코인이 부족합니다 (출석·일일 올클리어)')}
    else{const d=ITEMS[it.id];if(SAVE.inv[it.id])G.toast('이미 가지고 있습니다');else if(SAVE.coins>=d.price){SAVE.coins-=d.price;SAVE.inv[it.id]=1;sfx('lvl');G.toast(d.n+' 구매! 옷장에서 착용하세요');saveGame()}else G.toast('코인이 부족합니다')}
  }
  
}

    else if(it.potion){const d=POTION[it.id];txt(g,d.n,110,y+25,16,'#fff');txt(g,'보유 '+SAVE.potions[it.id],430,y+25,14,'#cfd4e2','right',2);txt(g,d.price+'●',590,y+25,16,'#ffd34a','right')}
    else if(it.cash){const d=ITEMS[it.id],own=SAVE.inv[it.id];txt(g,'['+SLOTS.find(s=>s[0]===d.slot)[1]+'] '+d.n.replace('[캐시] ',''),110,y+25,16,RCOL[4]);txt(g,own?'보유중':'캐시',430,y+25,14,own?'#7aff9a':'#cfd4e2','right',2);txt(g,'◆ '+d.ec,590,y+25,16,own?'#777':'#ff8ae0','right')}
    else{const d=ITEMS[it.id],own=SAVE.inv[it.id];txt(g,'['+SLOTS.find(s=>s[0]===d.slot)[1]+'] '+d.n,110,y+25,16,RCOL[d.r]);txt(g,own?'보유중':RARITY[d.r],430,y+25,14,own?'#7aff9a':'#cfd4e2','right',2);txt(g,d.price+'●',590,y+25,16,own?'#777':'#ffd34a','right')}
  });
  // preview
  panel(g,640,150,230,320,.7);
  const c=JOB[SAVE.job],it=lst[G.shop.sel];
  if((G.shop.cash||G.shop.tab===1)&&it){
    const eq=Object.assign({},PARTY[0].eq);eq[ITEMS[it.id].slot]=it.id;
    g.save();g.translate(755,390);g.scale(2.3,2.3);drawVeggie(g,c,{x:0,y:0,face:1,t,st:'idle',eq,tier:SAVE.tier,fid:SAVE.fid});g.restore();
    txt(g,'미리보기',755,178,15,'#ffe9a0','center');
  }else{txt(g,'야채 즙은 HP 40%',755,260,15,'#fff','center');txt(g,'맑은 물은 MP 50% 회복',755,290,15,'#fff','center');txt(g,'1번 / 2번 키로 사용',755,330,14,'#cfd4e2','center')}
  txt(g,'페이지 '+(pg+1)+'/'+Math.ceil(lst.length/per),350,484,13,'#cfd4e2','center',2);
}

const INV_TABS=['장비','소비','기타'];
function openInv(tab){G.ui='inv';G.inv={tab:tab||0,sel:0};sfx('sel')}
function invRows(){
  const t=G.inv.tab;
  if(t===0)return GSLOTS.map(([k,lb])=>({kind:'gear',slot:k,label:lb,id:SAVE.gear[k]||null})).concat(SLOTS.map((sl,i)=>({kind:'slot',i,label:sl[1],id:PARTY[0].eq[sl[0]]||null})));
  if(t===1){
    const r=[{kind:'potion',id:'hp'},{kind:'potion',id:'mp'},{kind:'mega',id:'m'},{kind:'mega',id:'h'}];
    for(const k of Object.keys(SCROLLS))r.push({kind:'scroll',id:k});
    return r;
  }
  const r=[];
  r.push({kind:'misc',n:'야채 조각',v:SAVE.inv.vegbit||0,d:'몬스터가 떨어뜨리는 재료. 퀘스트 납품에 쓴다.'});
  r.push({kind:'misc',n:'귀안(鬼眼)',v:SAVE.inv.gwi||0,d:'귀목의 제단에 바쳐 천년 귀목을 소환한다. 귀문 수문장 퀘스트로만 얻을 수 있다.'});
  r.push({kind:'misc',n:'도깨비 금이빨',v:SAVE.inv.gtooth||0,d:'귀문 동굴 몬스터가 20% 확률로 떨어뜨린다. 8개로 귀안 1개.'});

function gearPick(slot){

  const done=id=>{
    if(id){const err=gearEquip(id,slot);if(err){G.toast('착용 불가: '+err);sfx('hurt');return}}else delete SAVE.gear[slot];
    const p=PARTY[0],r=p.hp/p.maxhp;recalc(p);p.hp=Math.round(p.maxhp*r);sfx('pickup');saveGame();back()};
  const opts=own.map(k=>{const bad=gearCheck(k).length;return{t:(k===cur?'✔ ':bad?'✖ ':'')+'['+GRADE[GEAR[k].gr]+'] '+GEAR[k].n,fn:()=>done(k)}});

  const lines=own.map(k=>{const w=gearCheck(k);return(w.length?'✖ ':'')+'['+GRADE[GEAR[k].gr]+'] '+GEAR[k].n+(GEAR[k].quest?' (퀘스트)':'')+' — '+gearDesc(k)+(w.length?'\n   └ '+w[0]:'')});

  openDialog(lb+' 장착',(hint?hint+'\n\n':'')+(own.length?lines.slice(0,6).join('\n'):'가진 장비가 없다.\n보스를 쓰러뜨리면 낮은 확률로 장비가 떨어진다. (등급이 높을수록 희귀!)\n최고 등급은 퀘스트로만 얻을 수 있다.'),opts);
}

/* ---------- interactions (P1: ↑) ---------- */
function nearInteract(){
  const p=PARTY[0],L=S.L;if(!p||p.dead)return null;
  for(const n of L.npcs||[]){
    if(n.hidden){if(SAVE.lvl<(n.minLv||6)||Math.abs(p.x-n.x)>200||(n.seeY&&Math.abs(p.y-n.gy)>140))continue}
    if(Math.abs(p.x-n.x)<56&&Math.abs(p.y-n.gy)<40)return{k:'npc',n};
  }
  for(const po of L.portals){if(!po.hidden&&Math.abs(p.x-po.x)<52&&Math.abs(p.y-po.y)<70)return{k:'portal',po}}
  if(L.steles)for(const st of L.steles)if(Math.abs(p.x-st.x)<55&&Math.abs(p.y-st.y)<30)return{k:'stele',st};
  if(L.altar&&!S.boss&&Math.abs(p.x-L.altar.x)<60&&Math.abs(p.y-L.altar.y)<30)return{k:'altar'};
  return null;
}

const MOBNAME=id=>({dokkaebi:'도깨비 대왕',fox:'구미호',eggking:'킹 달걀 슬라임'})[id]||id;

/* ---------- main step ---------- */
function step(dt){
  G.t+=dt;
  for(const ts of G.toasts)ts.t+=dt;G.toasts=G.toasts.filter(ts=>ts.t<ts.max);
  if(tap('mute')&&G.state!=='title'){muted=!muted;if(muted)stopMusic(true);else startMusic(MUS.theme);G.toast(muted?'음소거':'소리 켬')}
  if(G.fade){
    G.fade.t+=dt;
    if(G.fade.phase==='out'&&G.fade.t>=.35){G.fade.cb();G.fade={t:0,phase:'in'}}
    else if(G.fade.phase==='in'&&G.fade.t>=.4)G.fade=null;
    if(G.fade&&G.fade.phase==='out')return;
  }
  if(G.state==='title')return titleStep();
  if(G.state==='select')return selectStep();
  if(!S)return;
  if(G.state==='over'){if(tap('ok')){const id=S.id;for(const p of PARTY){p.dead=false;p.hp=p.maxhp;p.mp=p.maxmp}if(S.L.pq===1||S.L.pq===2||S.L.pq===3)G.pqRun=Object.assign(G.pqRun||{},{});goMap(id)}if(pressed.Escape){for(const p of PARTY){p.dead=false;p.hp=p.maxhp}goMap('town')}return}
  if(G.state==='clear'){ambient(dt);if(tap('ok'))returnTown();return}
  // ----- play -----
  if(G.ui){
    if(G.ui==='dialog')dialogUpdate();
    else if(G.ui==='shop')shopUpdate();
    else if(G.ui==='wardrobe')wdUpdate();
    else if(G.ui==='inv')invUpdate();
    else if(G.ui==='scene')sceneUpdate(dt);
    else if(G.ui==='stat')statUpdate();
    else if(G.ui==='fame'){if(pressed.Escape||pressed.Enter||pressed.ArrowUp&&0)closeUI()}
    else if(G.ui==='qlog'){if(pressed.KeyQ||pressed.Escape||pressed.Enter)closeUI()}
    else if(G.ui==='help'){if(Object.keys(pressed).length)closeUI()}
    else if(G.ui==='pause'){const nv=nav();if(nv.u||nv.d){G.psel=1-(G.psel||0);sfx('sel')}if(pressed.KeyP||pressed.Escape){closeUI()}else if(nv.ok){if(G.psel){saveGame();stopMusic();G.state='title';G.ui=null;S=null}else closeUI()}}
    if(G.state==='play'&&S&&G.ui!=='scene')playStep(dt);   // 온라인 게임: UI 를 열어도 세계는 멈추지 않는다
    return;
  }
  if(pressed.KeyP||pressed.Escape){G.ui='pause';G.psel=0;return}
  if(pressed.KeyQ){G.ui='qlog';return}
  if(pressed.KeyO){openStat();return}
  if(pressed.Enter&&!G.chatOpen&&!(S.pvp&&S.pvp.over)){openChat();return}
  if(pressed.KeyI){openInv();return}
  if(pressed.KeyH){G.ui='help';return}
  if(pressed.Digit1)usePotion('hp');if(pressed.Digit2)usePotion('mp');
  if(pressed.KeyE)toggleHold();
  playStep(dt);
}
function ambient(dt){
  const L=S.L;
  if(Math.random()<dt*6)parts.push({x:S.cam.x+rnd(0,W),y:S.cam.y+rnd(H*.3,H),vx:rnd(-12,12),vy:rnd(-14,-4),life:4,max:4,size:rnd(1.4,2.6),col:THEMES[L.theme].fly,grav:0,glow:true,amb:true});
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.grav*dt;q.life-=dt;if(q.amb){q.vx+=rnd(-30,30)*dt;q.vy+=rnd(-30,30)*dt}}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);
  for(const tx of texts){tx.y+=tx.vy*dt;tx.vy*=.96;tx.life-=dt}for(let i=texts.length-1;i>=0;i--)if(texts[i].life<=0)texts.splice(i,1);
}
function playStep(dt){
  const L=S.L,lead=PARTY[0];
  if(S.hitstop>0){S.hitstop-=dt;return}
  if(S.slow>0){S.slow-=dt;dt*=.45}
  S.t+=dt;S.time+=dt;G.banner&&(G.banner.t+=dt);
  updatePlats(L,dt,S.t);
  for(const p of PARTY)updatePlayer(p,dt);
  updateMobs(dt);updateItems(dt);updatePshots(dt);updateEproj(dt);updateZones(dt);updateBoss(dt);storyStep(dt);presenceStep(dt);respawnStep(dt);fxStep(dt);
  // totems
  for(const d of S.drops){
    d.t+=dt;const ph=d.t%d.period;d.warn=ph>d.period-.75?1:0;
    if(d.t>=d.period){d.t-=d.period;const n=nearestAlive(d.x,d.y,800);if(n){addEproj({kind:'rock',x:d.x,y:d.y+22,vy:60,grav:1300,r:15,dmg:20,life:5});sfx('warn')}}
  }
  // pq
  if(L.pq&&S.pq&&!S.pq.done){
    const pq=S.pq;
    if(L.pq===1&&pq.coupons>=15)stageDone('영혼 쿠폰을 모두 모았다!');
    else if(L.pq===3&&pq.keys>=7)stageDone('열쇠를 모두 찾았다!');
    else if(L.pq===2){
      let on=0;L.plates.forEach(pl=>{pl.on=PARTY.some(q=>!q.dead&&q.onGround&&q.x>pl.x&&q.x<pl.x+pl.w&&Math.abs(q.y-pl.y)<6);if(pl.on)on++});
      pq.plateOn=on;if(on===L.plates.length)pq.hold+=dt;else pq.hold=Math.max(0,pq.hold-dt*2);
      if(pq.hold>=1.5)stageDone('혼의 발판이 하나가 되었다!');
    }
  }
  // fx
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<f.max);
  ambient(dt);
  S.shake=Math.max(0,S.shake-dt*40);
  // human 2P rubber band
  for(const p of PARTY){if(p.kind==='p2'&&!p.dead&&lead&&!lead.dead){const dx=Math.abs(p.x-lead.x),dy=Math.abs(p.y-lead.y);p.far=(dx>W/2-30||dy>H/2-10)?p.far+dt:0;if(p.far>1.5){p.x=lead.x;p.y=lead.y;p.vx=p.vy=0;p.far=0;sfx('portal');spark(p.x,p.y-30,16,'#cfe0ff',200,.5,3,0,true)}}}
  // interact
  const near=nearInteract();S.near=near;
  if(near&&pressed.ArrowUp&&!lead.rope){if(near.k==='stele')steleMenu(near.st.c);else if(near.k==='altar')summonGuimok();else if(near.k==='npc')talkNPC(near.n);else if(near.k==='portal'){if(near.po.pqNext){sfx('portal');goMap(near.po.to)}else usePortal(near.po)}}
